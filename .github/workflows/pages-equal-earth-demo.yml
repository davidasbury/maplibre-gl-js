# Publishes the Equal Earth demo page to GitHub Pages.
#
# This is fork-only infrastructure -- it exists to give the equal-area
# projection work a shareable URL, and is NOT intended to go upstream.
#
# dist/ is gitignored, so the bundles the demo imports are built here rather
# than committed. The published tree mirrors the repo layout the page expects
# (../../dist, ../bench/data), so the demo file itself needs no rewriting.
name: Deploy Equal Earth demo to Pages

on:
  push:
    branches: [equal-earth]
    paths:
      - 'src/**'
      - 'test/examples/equal-earth-demo.html'
      - 'test/examples/pmtiles-*.js'
      - 'test/examples/h3-js-*.js'
      - 'test/bench/data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rolldown.config.ts'
      - '.github/workflows/pages-equal-earth-demo.yml'
  # Triggers only on equal-earth pushes; the job builds BOTH variants (neutral
  # at root, esri at /esri/ from origin/equal-earth-esri). After an esri-only
  # change, redeploy /esri/ with a manual `workflow_dispatch` run.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push supersede an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so `git show origin/equal-earth-esri:…` can read the
          # esri demo without a second checkout.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      # build-dist minus build-prod: the demo imports the dev bundle, and
      # skipping the production build keeps this off the critical path.
      - name: Build bundles
        run: |
          npm run build-css
          npm run generate-unicode-data
          npm run generate-shaders
          npm run build-dev

      - name: Assemble site
        run: |
          set -euo pipefail
          # Two variants share the built engine (dist) + data + vendored JS,
          # differing only in the demo HTML: neutral (equal-earth) at the root,
          # esri (equal-earth-esri) at /esri/. The engine is identical on both
          # branches, so it's built once and mirrored into each variant.
          # $3 is an optional default query the index redirect appends -- e.g.
          # the /esri/ pitch URL opens on Esri Topographic without changing the
          # demo's own default (so the raw demo + gates keep the local NE land
          # default, and the redirect is the only place that knows the default).
          build_variant() {
            local branch="$1" dest="$2" query="${3:-}"
            mkdir -p "$dest/dist" "$dest/test/examples" "$dest/test/bench/data"
            cp -r dist/. "$dest/dist/"
            cp test/examples/pmtiles-4.4.1.min.js \
               test/examples/h3-js-4.3.0.umd.js \
               "$dest/test/examples/"
            cp test/bench/data/ne_110m_admin_0_countries.json \
               test/bench/data/naturalearth-land.json \
               "$dest/test/bench/data/"
            git show "origin/${branch}:test/examples/equal-earth-demo.html" \
               > "$dest/test/examples/equal-earth-demo.html"
            local url="./test/examples/equal-earth-demo.html${query}"
            cat > "$dest/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Equal Earth demo - MapLibre GL JS fork</title>
          <meta http-equiv="refresh" content="0; url=${url}">
          <link rel="canonical" href="${url}">
          <p><a href="${url}">Equal Earth demo</a></p>
          HTML
            # Fail loudly rather than shipping a blank map / empty demo.
            test -s "$dest/dist/maplibre-gl-dev.mjs"
            test -s "$dest/dist/maplibre-gl.css"
            test -s "$dest/test/bench/data/naturalearth-land.json"
            test -s "$dest/test/examples/equal-earth-demo.html"
          }
          build_variant equal-earth      site        ''                   # vendor-neutral (root)
          build_variant equal-earth-esri site/esri   '?source=esritopo'   # Esri pitch demo, opens on Esri topo

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
