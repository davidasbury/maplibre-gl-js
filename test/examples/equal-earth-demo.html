<!DOCTYPE html>
<html lang="en">

<head>
    <title>Equal Earth projection (demo)</title>
    <meta property="og:description" content="Equal-earth projection demo: land polygons, choropleth, demotiles and Overture basemaps with live diagnostics." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Inline data-URI favicon (hand-rolled, demo palette: panel dark,
         water #a4c8e1, land #d8e8c8, graticule #7a9cb8) so the browser
         stops 404-ing /favicon.ico. No external asset on purpose --
         third-party favicons (e.g. map-projections.net) are someone
         else's branding/CC BY-SA, and a data URI needs no fetch at all. -->
    <link rel='icon' type='image/svg+xml' href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%23141e28"/><ellipse cx="16" cy="16" rx="13" ry="8.5" fill="%23a4c8e1"/><path d="M6 11c4-3 9-2.5 13-1.5 3.5.9 6 2 6 4 0 2.5-4 3-7 4.5-3 1.5-8 2-10.5-.5C5 15 4.5 12.5 6 11z" fill="%23d8e8c8"/><g stroke="%237a9cb8" stroke-width="0.75" fill="none" opacity="0.85"><path d="M3 16h26"/><path d="M16 7.5v17"/><path d="M9.6 9.3C7.2 13.2 7.2 18.8 9.6 22.7"/><path d="M22.4 9.3c2.4 3.9 2.4 9.5 0 13.4"/></g><ellipse cx="16" cy="16" rx="13" ry="8.5" fill="none" stroke="%233a5a72" stroke-width="1"/></svg>'/>
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
        }

        /* Diagnostics panel (step-8 wishlist items 1/4/5). Position and
           palette are gate-load-bearing: the step-8 gate scripts pixel-
           sample the 10px-inset corners, rows y=2 and y=height-3, the
           center row, and a 200x200 center patch. top:40/left:10 sits in
           none of those, and the dark background can never read as void
           (void test is r,g,b all >250). Keep it that way. */
        #diag {
            position: absolute;
            top: 40px;
            left: 10px;
            z-index: 10;
            padding: 5px 10px;
            max-width: 220px;
            background: rgba(20, 30, 40, 0.82);
            color: #d8e8f0;
            /* Typography tightened (12px/1.6 -> 11px/1.35) when the
               section headers landed: the first cut measured a 380px
               panel bottom and broke the gate-sampled y=350 row (caught
               by gate E8 and two step8a gates). Budget: bottom < 345. */
            font: 11px/1.35 monospace;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Native checkboxes force ~18px line boxes regardless of font
           size; sizing them down is what actually buys panel height. */
        #diag input[type=checkbox] {
            width: 11px;
            height: 11px;
            margin: 0 3px 0 0;
            vertical-align: text-top;
        }

        .diag-section {
            margin-top: 2px;
            padding-top: 2px;
            border-top: 1px solid rgba(216, 232, 240, 0.25);
            font-size: 9px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.55;
        }

        #diag-tiles-glyph {
            display: inline-block;
        }

        #diag-tiles-glyph.diag-spin {
            animation: diag-spin 0.9s linear infinite;
        }

        @keyframes diag-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Panel is pointer-events:none so map drags pass through it; the
           checkbox rows are the interactive controls, so only they (and
           their labels, for click-to-toggle) opt back into pointer events.
           Gate-safety note: the sectioned layout (metrics / overlays /
           data layers, 2026-07-22 owner request) measures a ~292px panel
           bottom with the 11px/1.35 typography and 11px checkboxes --
           clear of every pixel-sampled region (center row y=350, center
           200x200 patch x>=450) per the comment above. Gate E8 asserts
           bottom < 345 and two step8a gates fail loudly on intrusion
           (both fired when the first sectioned cut measured 380px); keep
           new rows inside that budget. */
        .diag-toggle,
        .diag-toggle label {
            pointer-events: auto;
        }

        /* Per-dataset label sub-toggles (step 10): indented under their
           parent basemap row, only meaningful while that mode is active. */
        .diag-sub {
            margin-left: 16px;
        }

        /* Antimeridian clip mask (step 8 remainder (a)): a screen-space
           canvas painted white (the page's void color -- the gates'
           isVoidRGB matches r,g,b > 250) outside the projection outline.
           Below the diag panel (z 10), above the map canvas; never
           interactive. */
        #clip-mask {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body>
<div id="map"></div>
<canvas id="clip-mask"></canvas>
<div id="diag">
    <div>zoom: <span id="diag-zoom">&ndash;</span></div>
    <div>proj ratio: <span id="diag-blend">&ndash;</span> <span style="opacity:.6">(EE=1)</span></div>
    <div><span id="diag-tiles">tiles loading&hellip;</span> <span id="diag-tiles-glyph">&#9676;</span></div>
    <div id="diag-gl-row" hidden>gl: <span id="diag-gl">&ndash;</span></div>
    <div class="diag-toggle" title="Clip content beyond &lambda;0&plusmn;180&deg; to void at the projection outline (the Jenny-demo look; &lambda;0 keeps tracking the pan). Engine seam-bit stencil clip by default; ?engineclip=0 falls back to the page canvas mask. Also relaxes the zoom floor from pole-fit to outline-fit."><label for="diag-clip"><input type="checkbox" id="diag-clip" disabled /> clip antimeridian</label> <label for="diag-adaptive" title="Stage C: zoom-adaptive projection — Equal Earth below z4, mercator above z6, positional morph between. Disables the antimeridian clip (the seam mask is a pure-EE construct). Reload applies."><input type="checkbox" id="diag-adaptive" disabled /> adaptive</label></div>
    <div class="diag-section">overlays</div>
    <div id="diag-tissot-row" class="diag-toggle" title="Each circle covers equal ground N&ndash;S and E&ndash;W; its label is the on-screen width/height ratio. 1.00 = undistorted shape. Area stays equal at every latitude regardless."><label for="diag-tissot"><input type="checkbox" id="diag-tissot" disabled /> tissot</label> <span style="opacity:.6">(w/h, 1=round)</span></div>
    <div class="diag-toggle" title="15&deg; graticule lines (client-side GeoJSON; the curvature signature of Equal Earth). Not available in demotiles mode (remote style carries no graticule source)."><label for="diag-graticule"><input type="checkbox" id="diag-graticule" disabled /> graticule</label></div>
    <div class="diag-toggle diag-sub" title="Graticule line labels (meridian/parallel degree values, line-following along bowing meridians). Overture mode only &mdash; that style carries the label layer."><label for="diag-lbl-graticule"><input type="checkbox" id="diag-lbl-graticule" disabled /> labels</label></div>
    <div class="diag-toggle"><label for="diag-coast" title="Natural Earth coastline polylines, multi-scale (110m/50m/10m by zoom), over any data layer. Curated ocean coastline &mdash; one consistent estuary-inland judgment; lake shores intentionally absent. Network: fetched once per scale from the pinned NE v5.1.2 GeoJSON."><input type="checkbox" id="diag-coast" disabled /> coast</label> <label for="diag-shade" title="Mapterhorn hillshade as a standalone blend layer over any data layer (decoupled from the imagery)."><input type="checkbox" id="diag-shade" disabled /> shade</label> <label for="diag-image" title="Sentinel-2 cloudless imagery (EOX) at half opacity over any data layer &mdash; validation backdrop."><input type="checkbox" id="diag-image" disabled /> image</label></div>
    <div class="diag-section">data layers</div>
    <div class="diag-toggle" title="Local Natural Earth land polygons + graticule (network-free default)."><label for="diag-default"><input type="checkbox" id="diag-default" disabled /> default</label></div>
    <div class="diag-toggle" title="Bucketed choropleth over the local land polygons (deterministic hash-of-coordinate buckets, YlOrRd ramp)."><label for="diag-choropleth"><input type="checkbox" id="diag-choropleth" disabled /> choropleth</label></div>
    <div class="diag-toggle" title="demotiles.maplibre.org basemap with equal-earth applied via transformStyle (network required)."><label for="diag-demotiles"><input type="checkbox" id="diag-demotiles" disabled /> demotiles</label></div>
    <div class="diag-toggle diag-sub" title="Toggle the demotiles label layers (countries + geolines) for label-isolation testing."><label for="diag-lbl-demotiles"><input type="checkbox" id="diag-lbl-demotiles" disabled /> labels</label></div>
    <div class="diag-toggle" title="Overture Maps PMTiles (base + buildings + divisions + transportation), fully labeled &mdash; the step-9 symbols/collision corpus. Remote range requests to the Overture S3 bucket (network required)."><label for="diag-overture"><input type="checkbox" id="diag-overture" disabled /> overture</label></div>
    <div class="diag-toggle diag-sub" title="Toggle the Overture divisions labels (country/region/locality points)."><label for="diag-lbl-divisions"><input type="checkbox" id="diag-lbl-divisions" disabled /> divisions</label></div>
    <div class="diag-toggle diag-sub" title="Toggle the Overture road labels (line-following, z11+)."><label for="diag-lbl-roads"><input type="checkbox" id="diag-lbl-roads" disabled /> roads</label></div>
    <div class="diag-toggle" title="Global Mapterhorn terrarium DEM driving a hillshade layer, blended over the demotiles watercolor PMTiles archive (Innsbruck region &mdash; the CORS-open mirror of the Cooper Hewitt watercolor tiles). Network required."><label for="diag-terrain"><input type="checkbox" id="diag-terrain" disabled /> terrain</label></div>
    <div class="diag-toggle" title="Hexagonal-bin basemap: Uber H3 cells (earth-fixed, seam-proof at every latitude, ~2% area wobble, 12 pentagons), shaded by land fraction — Overture coastline resolution where tiles are loaded, Natural Earth elsewhere. Resolution adapts to zoom."><label for="diag-hexbins"><input type="checkbox" id="diag-hexbins" disabled /> hexbins</label></div>
</div>
<script src="./pmtiles-4.4.1.min.js"></script>
<script src="./h3-js-4.3.0.umd.js"></script>
<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    // 15-degree graticule as a client-side GeoJSON so curvature of parallels/
    // meridians (the visible signature of Equal Earth vs mercator) is obvious.
    // Each line carries a `name` property ("30°E", "15°S", …) so label-
    // bearing styles (the step-9 Overture corpus) can run line-following
    // symbols along it — meridians bow under Equal Earth, making these the
    // page's own regression corpus for curved line-label placement. The
    // geometry-only styles simply don't reference the property.
    function graticuleName(value, positiveSuffix, negativeSuffix) {
        if (value === 0) return '0°';
        return `${Math.abs(value)}°${value > 0 ? positiveSuffix : negativeSuffix}`;
    }
    const graticule = {type: 'FeatureCollection', features: []};
    for (let lng = -180; lng <= 180; lng += 15) {
        const coords = [];
        for (let lat = -90; lat <= 90; lat += 2) coords.push([lng, lat]);
        graticule.features.push({type: 'Feature', properties: {name: graticuleName(lng, 'E', 'W')}, geometry: {type: 'LineString', coordinates: coords}});
    }
    for (let lat = -90; lat <= 90; lat += 15) {
        const coords = [];
        for (let lng = -180; lng <= 180; lng += 2) coords.push([lng, lat]);
        graticule.features.push({type: 'Feature', properties: {name: graticuleName(lat, 'N', 'S')}, geometry: {type: 'LineString', coordinates: coords}});
    }

    // Step 6 sweep support: read center/zoom from the URL query string
    // (?lng=&lat=&zoom=) so a headless-render sweep can drive many positions
    // without editing this file per shot. A `?source=demotiles` query param
    // switches the style to the real demotiles.maplibre.org basemap
    // (network permitting) with the equal-earth projection applied, per
    // step 6's "demotiles attempt" gate.
    // Default central meridian is +11.5 (owner request 2026-07-22): it puts
    // the antimeridian seam at 168.5W, threading the Bering Strait between
    // Cape Dezhnev (169.7W) and Cape Prince of Wales (168.1W) so the seam
    // crosses the fewest land pieces. (First cut used -11.5 -- seam at
    // 168.5E, through mainland Chukotka; wrong hemisphere.) Headless
    // gates/sweeps all pass ?lng= explicitly, so they are unaffected.
    const params = new URLSearchParams(window.location.search);
    const centerLng = params.has('lng') ? parseFloat(params.get('lng')) : 11.5;
    const centerLat = params.has('lat') ? parseFloat(params.get('lat')) : 0;
    const zoom = params.has('zoom') ? parseFloat(params.get('zoom')) : 1.4;
    const useDemotiles = params.get('source') === 'demotiles';

    // `?source=overture` renders Overture Maps PMTiles. Landed geometry-only
    // as the step-10 forward pull; since step 9 (symbols/collision) it is the
    // fully-labeled test corpus -- divisions (country/region/locality
    // labels), transportation (line-following road labels) and graticule
    // line labels, all placed against the live central meridian.
    // Design note: docs/resources/
    // 2026-07-22-overture-pmtiles-mlt-test-source.md. Archives are MVT in
    // PMTiles on the public Overture S3 bucket (verified 2026-07-22: range
    // requests honored, base z0-13, buildings z6-14); the pmtiles protocol
    // shim is the vendored UMD build loaded above (global `pmtiles`), and
    // the protocol synthesizes TileJSON (min/max zoom, bounds) from each
    // archive's header, so past z13 the source overzooms -- exactly the
    // provider-v2 stress this mode exists to exercise.
    const useOverture = params.get('source') === 'overture';

    // Terrain/hillshade attempt (owner request, 2026-07-23): global
    // Mapterhorn terrarium DEM (hosted XYZ, CORS-open) driving a hillshade
    // layer, blended over the demotiles watercolor PMTiles archive
    // (Innsbruck region, maxzoom 11). The Cooper Hewitt global watercolor
    // endpoint serves NO CORS headers and is browser-blocked from this
    // origin — the demotiles archive is its usable regional mirror.
    const useTerrain = params.get('source') === 'terrain';

    // ---- Hexagonal-bin basemap (owner request, 2026-07-23) --------------
    // Uber H3 cells, earth-fixed and seam-proof. The first cut was a
    // uniform hex grid in the EE projected plane (exactly equal-area by
    // the projection's defining property), but a plane-fixed grid
    // provably cannot tile the ±180 seam at every latitude — world
    // copies displace by 2·halfWidth(φ) while any plane grid has one
    // fixed period (2026-07-23 findings doc) — so the owner removed it
    // in favor of H3 (~2% area wobble, 12 pentagons, but honest
    // everywhere). Cells are shaded by land fraction: Overture water
    // polygons at coastline resolution where tiles are loaded, a Natural
    // Earth EE-plane raster elsewhere. Resolution adapts to zoom;
    // generation is limited to the viewport (+margin) beyond z3.
    const useHexbins = params.get('source') === 'hexbins';

    // ---- Stage C adaptive blend (plan step 11, 2026-07-23) --------------
    // `?adaptive=1`: the projection becomes the named `equal-earth-adaptive`
    // preset (factory default z4/z6 stops, step 12) — pure Equal Earth
    // below z4, pure mercator above z6, positional morph between (the
    // panel's "proj ratio" row reads the live transition state; it was
    // built waiting for this day). The engine antimeridian clip stays off
    // in this mode: the seam mask is drawn from the pure-EE outline and
    // would clip mid-morph content. Off by default — it's mutually
    // exclusive with the clip=1 default (the demo's face, owner request).
    const useAdaptive = params.get('adaptive') === '1';
    function projectionSpec() {
        return useAdaptive
            ? {type: 'equal-earth-adaptive'}
            : {type: 'equal-earth'};
    }

    // Minimal EE forward/inverse for page-side grid math — mirrors
    // src/geo/equal_earth_coordinate.ts (values must match; the engine
    // renders with the same constants).
    const EE = (() => {
        const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796;
        const M = Math.sqrt(3) / 2;
        const EXTENT_W = 2 * 2.7066299836960748;
        function forward(lng, lat) {
            const lam = lng * Math.PI / 180, phi = lat * Math.PI / 180;
            const t = Math.asin(M * Math.sin(phi)), t2 = t * t, t6 = t2 * t2 * t2;
            const x = lam * Math.cos(t) / (M * (A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2)));
            const y = t * (A1 + A2 * t2 + t6 * (A3 + A4 * t2));
            return {x: x / EXTENT_W + 0.5, y: 0.5 - y / EXTENT_W};
        }
        function inverse(x, y) {
            const px = (x - 0.5) * EXTENT_W, py = (0.5 - y) * EXTENT_W;
            let t = py;
            for (let i = 0; i < 12; i++) {
                const t2 = t * t, t6 = t2 * t2 * t2;
                const fy = t * (A1 + A2 * t2 + t6 * (A3 + A4 * t2)) - py;
                const fpy = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
                const d = fy / fpy;
                t -= d;
                if (Math.abs(d) < 1e-9) break;
            }
            const t2 = t * t, t6 = t2 * t2 * t2;
            const lam = M * px * (A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2)) / Math.cos(t);
            const phi = Math.asin(Math.max(-1, Math.min(1, Math.sin(t) / M)));
            return {lng: lam * 180 / Math.PI, lat: phi * 180 / Math.PI};
        }
        const yNorth = forward(0, 90).y, ySouth = forward(0, -90).y;
        // Outline half-width at a given unit y (for grid trimming).
        function halfWidthAtY(y) {
            const lat = inverse(0.5, y).lat;
            return forward(180, lat).x - 0.5;
        }
        return {forward, inverse, yNorth, ySouth, halfWidthAtY};
    })();

    // Land rasterization (built lazily once): Natural Earth polygons drawn
    // filled into an offscreen canvas mapped over the EE content region.
    let landSampler = null;
    async function getLandSampler() {
        if (landSampler) return landSampler;
        const land = await getLandData();
        const W = 2048, H = 1024;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d', {willReadFrequently: true});
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        const toPx = (lng, lat) => {
            const p = EE.forward(lng, lat);
            return [p.x * W, (p.y - EE.yNorth) / (EE.ySouth - EE.yNorth) * H];
        };
        const drawRing = (ring) => {
            ring.forEach(([lng, lat], i) => {
                const [x, y] = toPx(lng, lat);
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.closePath();
        };
        for (const f of land.features) {
            const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
            for (const rings of polys) {
                ctx.beginPath();
                for (const ring of rings) drawRing(ring);
                ctx.fill('evenodd');
            }
        }
        const data = ctx.getImageData(0, 0, W, H).data;
        landSampler = (x, y) => {
            const xWrapped = ((x % 1) + 1) % 1; // seam-straddling cells sample the wrapped world
            const px = Math.max(0, Math.min(W - 1, Math.round(xWrapped * W)));
            const py = Math.max(0, Math.min(H - 1, Math.round((y - EE.yNorth) / (EE.ySouth - EE.yNorth) * H)));
            return data[(py * W + px) << 2] > 127 ? 1 : 0;
        };
        return landSampler;
    }

    // Seam-straddling cells must NOT be emitted with unwrapped longitudes:
    // vertices beyond ±180 get renormalized somewhere in the GeoJSON
    // pipeline and the rings mangle into the owner-reported column of
    // white shards at the antimeridian. Split them at ±180 into a
    // MultiPolygon instead (each piece a simple in-range ring); the
    // quantized grid guarantees the two pieces join seamlessly across
    // the seam.
    function hexGeometry(ring) {
        const lngs = ring.map(([lng]) => lng);
        const over = Math.max(...lngs) > 180, under = Math.min(...lngs) < -180;
        if (!over && !under) return {type: 'Polygon', coordinates: [ring]};
        const pieces = [];
        if (over) {
            const inRange = clipRingToHalfPlane(ring, true, 180);
            const wrapped = clipRingToHalfPlane(ring.map(([lng, lat]) => [lng - 360, lat]), false, -180);
            if (inRange) pieces.push([inRange]);
            if (wrapped) pieces.push([wrapped]);
        } else {
            const inRange = clipRingToHalfPlane(ring, false, -180);
            const wrapped = clipRingToHalfPlane(ring.map(([lng, lat]) => [lng + 360, lat]), true, 180);
            if (inRange) pieces.push([inRange]);
            if (wrapped) pieces.push([wrapped]);
        }
        return {type: 'MultiPolygon', coordinates: pieces};
    }

    let hexLastGen = null; // {bucket, x0, x1, y0, y1, ovTried, ov} — regen hysteresis + overture-sampler state

    // The hexbin basemap: earth-fixed hexagonal cells from Uber's H3
    // grid (vendored h3-js UMD, window.h3). H3 is THE hexbin mode: the
    // EE-plane uniform grid it replaced provably cannot be
    // seam-consistent at every latitude (world copies displace by
    // 2·halfWidth(φ) while any plane grid has one fixed period — the
    // 2026-07-23 findings doc; owner removed it 2026-07-23), while H3
    // cells never shear and render identically on both sides of ±180.
    // Area wobble ~2% within a resolution, 12 pentagons per resolution.
    const H3_EDGE_KM = [1107.7, 418.7, 158.2, 59.8, 22.6, 8.54, 3.23, 1.22, 0.46];
    function h3ResForZoom(fz) {
        // Match the plane-grid apparent-size schedule (cells ~40-80 px,
        // halving per zoom bucket): pick the first resolution whose edge
        // is at or below the bucket's target.
        const targetKm = 2349 / Math.pow(2, fz);
        for (let r = 0; r < H3_EDGE_KM.length; r++) {
            if (H3_EDGE_KM[r] <= targetKm * 1.4) return r;
        }
        return H3_EDGE_KM.length - 1;
    }

    // Pole-containing cells: the boundary loops all the way around in
    // longitude, which no lng/lat ring can express directly — rebuild as
    // the standard pole-wrapped band (sorted by lng, closed over the
    // pole; the mercator data limit clips it at ±85.05° like every other
    // polar polygon in this demo — same limitation, same look).
    function h3PoleGeometry(ring, isNorth) {
        const pts = ring.slice(0, -1)
            .map(([lng, lat]) => [((lng % 360) + 540) % 360 - 180, lat])
            .sort((a, b) => a[0] - b[0]);
        const pole = isNorth ? 90 : -90;
        return {type: 'Polygon', coordinates: [[
            ...pts,
            [180, pts[pts.length - 1][1]], [180, pole],
            [-180, pole], [-180, pts[0][1]],
            pts[0]
        ]]};
    }

    // Overture-informed land sampling (owner enhancement, 2026-07-23
    // round 2): the Natural Earth raster is 2048px across the whole
    // world (~0.18°/px) — far coarser than H3 cells beyond ~z6. When the
    // hexbin style's hidden Overture water layer has tiles loaded,
    // rasterize the queried water polygons into a viewport-scoped canvas
    // in the same EE plane and sample that instead, falling back to the
    // Natural Earth raster outside the trusted (tiles-actually-loaded)
    // region. Returns null when no water features are queryable yet —
    // the caller then retries once on the next map idle.
    function buildOvertureWaterSampler(vx0, vx1, vy0, vy1) {
        if (!map || !map.getStyle() || !map.getSource('overture-base')) return null;
        let feats;
        try {
            feats = map.querySourceFeatures('overture-base', {sourceLayer: 'water'});
        } catch (e) {
            return null;
        }
        if (!feats.length) return null;
        const W = 1400;
        const H = Math.max(64, Math.min(4096, Math.round(W * (vy1 - vy0) / (vx1 - vx0))));
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d', {willReadFrequently: true});
        ctx.fillStyle = '#fff';
        const drawPoly = (rings, off) => {
            ctx.beginPath();
            for (const ring of rings) {
                ring.forEach(([lng, lat], i) => {
                    const p = EE.forward(lng, lat);
                    const px = (p.x + off - vx0) / (vx1 - vx0) * W;
                    const py = (p.y - vy0) / (vy1 - vy0) * H;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                });
                ctx.closePath();
            }
            ctx.fill('evenodd');
        };
        for (const f of feats) {
            const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] :
                f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [];
            // The generation frame is unwrapped around the view center;
            // queried geometry is canonical — draw at every world-copy
            // offset that lands inside the raster.
            for (const rings of polys) {
                for (const off of [-1, 0, 1]) {
                    const x = EE.forward(rings[0][0][0], rings[0][0][1]).x + off;
                    if (x > vx0 - 0.25 && x < vx1 + 0.25) drawPoly(rings, off);
                }
            }
        }
        const data = ctx.getImageData(0, 0, W, H).data;
        return (x, y) => {
            for (const off of [-1, 0, 1]) {
                const xx = x + off;
                if (xx < vx0 || xx > vx1 || y < vy0 || y > vy1) continue;
                const px = Math.max(0, Math.min(W - 1, Math.round((xx - vx0) / (vx1 - vx0) * W)));
                const py = Math.max(0, Math.min(H - 1, Math.round((y - vy0) / (vy1 - vy0) * H)));
                return data[((py * W + px) << 2) + 3] > 127 ? 0 : 1; // water painted -> not land
            }
            return -1; // outside trusted region
        };
    }

    // The outline layer must not trace the artificial ±180 clip edges of
    // seam-split cells — that doubled edge was the owner-reported white
    // north-south line at the antimeridian. Cells therefore emit the six
    // REAL hexagon edges as a separate MultiLineString feature (each
    // edge split at ±180 into canonical pieces), and the line layer
    // filters to LineStrings.
    function h3EdgeLines(ring) {
        const lines = [];
        for (let i = 0; i < ring.length - 1; i++) {
            const a = ring[i], b = ring[i + 1];
            if (a[0] === b[0] && a[1] === b[1]) continue;
            const lo = Math.min(a[0], b[0]), hi = Math.max(a[0], b[0]);
            if (hi <= 180 && lo >= -180) { lines.push([a, b]); continue; }
            const bound = hi > 180 ? 180 : -180;
            const shift = hi > 180 ? -360 : 360;
            if (lo >= 180 || hi <= -180) {
                lines.push([[a[0] + shift, a[1]], [b[0] + shift, b[1]]]);
                continue;
            }
            const t = (bound - a[0]) / (b[0] - a[0]);
            const latX = a[1] + t * (b[1] - a[1]);
            for (const seg of [[a, [bound, latX]], [[bound, latX], b]]) {
                if (seg[0][0] === seg[1][0] && seg[0][1] === seg[1][1]) continue;
                const free = seg[0][0] === bound ? seg[1] : seg[0];
                const beyond = bound === 180 ? free[0] > 180 : free[0] < -180;
                lines.push(beyond ? seg.map(([lng, lat]) => [lng + shift, lat]) : seg);
            }
        }
        return {type: 'MultiLineString', coordinates: lines};
    }

    async function buildHexbinFeatures() {
        const neSampler = await getLandSampler();
        const zoom = map ? map.getZoom() : 1.4;
        const fz = Math.floor(zoom);
        const res = h3ResForZoom(fz);
        let cells;
        let x0 = 0, x1 = 1, y0 = EE.yNorth, y1 = EE.ySouth;
        let ovSampler = null;
        if (map && zoom > 3) {
            const corners = [[0, 0], [map.getContainer().clientWidth, 0], [0, map.getContainer().clientHeight], [map.getContainer().clientWidth, map.getContainer().clientHeight]];
            const lng0 = map.getCenter().lng;
            const pts = corners.map(([px, py]) => {
                const ll = map.unproject([px, py]);
                let lng = ll.lng;
                while (lng - lng0 > 180) lng -= 360;
                while (lng - lng0 < -180) lng += 360;
                return EE.forward(lng, ll.lat);
            });
            const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
            const vx0 = Math.min(...xs), vx1 = Math.max(...xs);
            const vy0 = Math.min(...ys), vy1 = Math.max(...ys);
            const mx = 0.3 * (vx1 - vx0), my = 0.3 * (vy1 - vy0);
            x0 = vx0 - mx; x1 = vx1 + mx;
            y0 = Math.max(EE.yNorth, vy0 - my); y1 = Math.min(EE.ySouth, vy1 + my);
            // Cover the viewport with a grid disk around the center
            // cell: coverage is computed in H3's own grid space, so the
            // seam and the poles need no special casing at all.
            const c = map.getCenter();
            const centerCell = window.h3.latLngToCell(c.lat, c.lng, res);
            const diagKm = Math.hypot(x1 - x0, y1 - y0) * 40075;
            const k = Math.min(40, Math.ceil((diagKm * 0.55) / (1.5 * H3_EDGE_KM[res])) + 2);
            cells = window.h3.gridDisk(centerCell, k);
            // High-res coastlines where available: the trusted region is
            // the viewport proper (no margin) — covering tiles are only
            // guaranteed loaded there.
            ovSampler = buildOvertureWaterSampler(vx0, vx1, vy0, vy1);
        } else {
            cells = window.h3.getRes0Cells();
            if (res > 0) cells = cells.flatMap((cell) => window.h3.cellToChildren(cell, res));
        }
        hexLastGen = {bucket: fz, x0, x1, y0, y1, ov: !!ovSampler, ovTried: false};
        const sampleLand = (x, y) => {
            if (ovSampler) {
                const v = ovSampler(x, y);
                if (v >= 0) return v;
            }
            return neSampler(x, y);
        };
        const features = [];
        for (const cell of cells) {
            const [clat, clng] = window.h3.cellToLatLng(cell);
            const ctr = EE.forward(clng, clat);
            // cellToBoundary(_, true) does NOT unwrap seam-crossing rings
            // (mixed-sign lngs, verified against 4.3.0) — unwrap around
            // the cell center, then the existing ±180 splitter applies
            // unchanged.
            const bnd = window.h3.cellToBoundary(cell, true);
            const ring = bnd.map(([lng, lat]) => {
                while (lng - clng > 180) lng -= 360;
                while (lng - clng < -180) lng += 360;
                return [lng, lat];
            });
            if (ring.length && (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1])) {
                ring.push(ring[0]);
            }
            // Land fraction: center + boundary vertices pulled 30%
            // inward, sampled through the overture raster where trusted
            // and the (wrapping) Natural Earth EE-plane raster elsewhere.
            let hits = sampleLand(ctr.x, ctr.y), n = 1;
            for (let i = 0; i < ring.length - 1; i++) {
                const p = EE.forward(ring[i][0], ring[i][1]);
                hits += sampleLand(ctr.x + 0.7 * (p.x - ctr.x), ctr.y + 0.7 * (p.y - ctr.y));
                n++;
            }
            const lngs = ring.map(([lng]) => lng);
            const poleCell = Math.max(...lngs) - Math.min(...lngs) > 270;
            const land = +(hits / n).toFixed(2);
            // Coastline-crossing class (owner request, round 6): any
            // disagreement among the samples means the cell straddles a
            // coastline — a distinct class, not a color on the ramp, so
            // it can carry its own styling and future data joins.
            const props = {land, cell, coast: hits > 0 && hits < n};
            features.push({
                type: 'Feature',
                properties: props,
                geometry: poleCell ? h3PoleGeometry(ring, clat > 0) : hexGeometry(ring)
            });
            features.push({
                type: 'Feature',
                properties: props,
                geometry: h3EdgeLines(ring)
            });
        }
        return {type: 'FeatureCollection', features};
    }

    async function refreshHexbins() {
        const source = map.getSource('hexbins');
        if (!source) return;
        source.setData(await buildHexbinFeatures());
    }

    async function buildHexbinStyle() {
        ensurePmtilesProtocol(); // the overture-base source below is pmtiles://
        return {
            version: 8,
            projection: projectionSpec(),
            sources: {
                hexbins: {type: 'geojson', data: await buildHexbinFeatures()},
                // Loaded (invisibly) for its water polygons: the
                // Overture-informed land sampler queries this source to
                // style cells with real coastline resolution. maxzoom 10
                // overzooms beyond that — z10 water detail is plenty for
                // cell-fraction sampling, and without the cap one z12.9
                // hexbin viewport pulled ~54 MB of base tiles (owner
                // screenshot, 2026-07-22 20:49).
                'overture-base': {type: 'vector', url: overtureArchiveUrl('base'), maxzoom: 10},
                graticule: {type: 'geojson', data: graticule}
            },
            layers: [
                {id: 'background', type: 'background', paint: {'background-color': '#eef3f6'}},
                // Invisible layer so the water tiles actually load;
                // querySourceFeatures needs a referencing style layer.
                {id: 'hex-water-loader', type: 'fill', source: 'overture-base', 'source-layer': 'water', paint: {'fill-opacity': 0}},
                {
                    id: 'hexbins-fill', type: 'fill', source: 'hexbins',
                    filter: ['==', '$type', 'Polygon'],
                    paint: {
                        // Coastline-crossing cells are a distinct class
                        // (warm sand, shaded by how much land they hold);
                        // pure water / pure land keep the cool ramp.
                        'fill-color': ['case', ['get', 'coast'],
                            ['interpolate', ['linear'], ['get', 'land'],
                                0, '#ead9a8', 1, '#dfcf96'],
                            ['interpolate', ['linear'], ['get', 'land'],
                                0, '#b8d3e6', 1, '#d3e3bd']],
                        'fill-opacity': 0.92
                    }
                },
                // Outlines come from the dedicated edge-line features
                // (h3EdgeLines), NOT the polygon rings — the polygons'
                // artificial ±180 clip edges must not be traced. Coastal
                // cells get a slightly stronger warm outline.
                {
                    id: 'hexbins-outline', type: 'line', source: 'hexbins',
                    filter: ['==', '$type', 'LineString'],
                    paint: {
                        'line-color': ['case', ['get', 'coast'], '#c9b479', '#ffffff'],
                        'line-width': ['case', ['get', 'coast'], 1.2, 0.8],
                        'line-opacity': 0.85
                    }
                },
                {id: 'graticule', type: 'line', source: 'graticule', paint: {'line-color': '#7a9cb8', 'line-width': 0.5, 'line-opacity': 0.6}}
            ]
        };
    }


    // Step 7: `?choropleth=1` swaps the flat land fill for a bucketed
    // choropleth layered over the same local style (background + graticule
    // unchanged). Data source: this repo has no admin-0/countries GeoJSON
    // (checked test/bench/** and docs/assets/** -- only regional single-
    // place files exist, docs/assets/us_states.geojson and
    // docs/assets/rwanda-provinces.geojson, neither global), so polygons are
    // instead derived from the existing naturalearth-land.json land layer,
    // bucketed by a deterministic per-feature planar-shoelace area estimate
    // (5 quantile classes). Honest for demonstrating equal-area RENDERING
    // even without real per-country statistics attached to the polygons.
    const useChoropleth = params.get('choropleth') === '1';

    // Step 8 remainder (a) antimeridian clip mode: `?clip=1` masks content
    // beyond lambda0+-180deg to void at the projection outline (the Jenny-
    // demo look; lambda0 keeps tracking the pan, per owner round 2). Two
    // cooperating parts: (1) the engine-side `outlineFitZoomFloor` flag on
    // EqualEarthTransform relaxes the zoom floor from pole-fit to
    // outline-fit -- without it the seam sits at +-worldSize/2 px from
    // screen center, which is beyond the viewport edge at every reachable
    // zoom on a normal-aspect viewport, and the mask would never be
    // visible; (2) a page-side screen-space canvas mask (#clip-mask) that
    // samples the two seam meridians via map.project() each frame and
    // paints everything outside that outline void-white. The mask is the
    // demo-grade rendering of the clip; the engine stencil pre-pass stays
    // the eventual in-engine/upstream version. As with tissot, the URL
    // param is just the checkbox's initial state.
    // Clip is ON by default (owner request 2026-07-22 -- the Jenny look is
    // the demo's face); `?clip=0` opts out, and the checkbox writes clip=0
    // when unchecked / removes the param when checked. `?clip=1` still
    // parses as on for old copied URLs. Headless gates that exercise
    // unclipped behavior pin clip=0 explicitly.
    // Clip is force-disabled in adaptive mode: the seam mask is a pure-EE
    // construct and would clip mid-morph content (and the adaptive
    // transform doesn't carry the EE-only clip flags).
    const useClip = params.get('clip') !== '0' && !useAdaptive;

    // Engine seam-bit stencil clip is the DEFAULT since 2026-07-22 (owner
    // approved after the session-0030 fixes); `?engineclip=0` falls back to
    // the page's screen-space canvas mask (the original demo-grade
    // implementation, kept as the A/B lever the engine-clip gate drives).
    // `?engineclip=1` still parses for old copied URLs. Only meaningful
    // while clip mode is on.
    const useEngineClip = params.get('engineclip') !== '0';

    // Graticule lines overlay toggle (owner request, 2026-07-23 defaults
    // pass): default OFF, `?grat=1` opts in. Applies to the 'graticule'
    // line layer wherever the current style carries it (demotiles does
    // not — its remote style has no graticule source).
    let graticuleOn = params.get('grat') === '1';

    function applyGraticuleVisibility() {
        if (map.getLayer('graticule')) {
            map.setLayoutProperty('graticule', 'visibility', graticuleOn ? 'visible' : 'none');
        }
    }

    // f32-ladder diagnostic param: `?srcmax=N` caps the GeoJSON sources'
    // maxzoom so tiles overzoom past N. This bounds the covering-tiles
    // enumeration (the z>=12 freeze suspect) while the shader still runs at
    // the display zoom's world scale -- letting the precision ladder measure
    // f32 error at zooms the naive tile provider can't otherwise reach.
    const srcMax = params.has('srcmax') ? parseInt(params.get('srcmax'), 10) : null;
    const srcMaxOpt = srcMax !== null ? {maxzoom: srcMax} : {};

    // Shoelace ring area in raw degrees^2 -- a relative ordering metric for
    // bucketing only, not a true geodesic area (fine for a rendering demo).
    function ringArea(ring) {
        let sum = 0;
        for (let i = 0; i < ring.length - 1; i++) {
            const [x1, y1] = ring[i];
            const [x2, y2] = ring[i + 1];
            sum += (x1 * y2) - (x2 * y1);
        }
        return Math.abs(sum) / 2;
    }
    function polygonArea(rings) {
        let area = ringArea(rings[0]);
        for (let i = 1; i < rings.length; i++) area -= ringArea(rings[i]);
        return Math.max(area, 0);
    }
    function featureArea(feature) {
        const geometry = feature.geometry;
        if (geometry.type === 'Polygon') return polygonArea(geometry.coordinates);
        if (geometry.type === 'MultiPolygon') return geometry.coordinates.reduce((sum, poly) => sum + polygonArea(poly), 0);
        return 0;
    }

    // Sequential 5-class ramp (ColorBrewer YlOrRd) plus thin dark outlines.
    const CHOROPLETH_RAMP = ['#ffffb2', '#fecc5c', '#fd8d3c', '#f03b20', '#bd0026'];

    // Deterministic FNV-1a-style hash of a feature's first coordinate, used
    // to assign its bucket independently of polygon size. (Area-quantile
    // bucketing was tried first: land-polygon areas here span ~8 orders of
    // magnitude, so count-based quantiles put every continent in the same
    // top bucket and only tiny islands spread across the rest -- technically
    // deterministic but a visually monotonous demo. Hash-of-coordinate has
    // no such correlation.)
    function hashFeature(feature) {
        const geometry = feature.geometry;
        const ring = geometry.type === 'Polygon' ? geometry.coordinates[0] : geometry.coordinates[0][0];
        const [lng, lat] = ring[0];
        const str = `${lng.toFixed(4)},${lat.toFixed(4)}`;
        let hash = 2166136261;
        for (let i = 0; i < str.length; i++) {
            hash ^= str.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        return Math.abs(hash);
    }

    async function buildChoroplethSource() {
        const land = await getLandFillData();
        return {
            type: 'FeatureCollection',
            features: land.features.map((feature) => ({...feature, properties: {...feature.properties, bucket: hashFeature(feature) % 5, area: featureArea(feature)}}))
        };
    }

    // Step 8 Tissot's-indicatrix mode: `?tissot=1` overlays geodesic small
    // circles (radius 3.75 degrees, 48-point spherical approximation) on a
    // 30-degree grid to visualize local distortion. Off by default -- the
    // step-8 gate scripts run without this param and must be unaffected.
    // The diagnostics-panel checkbox drives the same overlay live (see
    // addTissotOverlay/removeTissotOverlay below), so the URL param is just
    // the checkbox's initial state, not the only way in.
    // Each circle's on-screen width/height ratio (sampled via map.project()
    // at +-0.5 degree offsets from its center) is written into the
    // feature's `ratio`/`ratioLabel` properties and shown as a label.
    // Equal Earth is pseudocylindrical, so the ratio is expected to vary
    // with latitude only -- not force a value, just measure and report.
    const useTissot = params.get('tissot') === '1';
    const TISSOT_RADIUS_DEG = 3.75;
    const TISSOT_STEPS = 48;

    function toRad(deg) { return deg * Math.PI / 180; }
    function toDeg(rad) { return rad * 180 / Math.PI; }

    // Standard spherical destination-point formula: the point `distDeg`
    // degrees of angular distance from [lng,lat] along initial bearing
    // `bearingDeg`.
    function destinationPoint(lng, lat, distDeg, bearingDeg) {
        const phi1 = toRad(lat), lambda1 = toRad(lng);
        const theta = toRad(bearingDeg);
        const delta = toRad(distDeg);
        const phi2 = Math.asin(Math.sin(phi1) * Math.cos(delta) + Math.cos(phi1) * Math.sin(delta) * Math.cos(theta));
        const lambda2 = lambda1 + Math.atan2(
            Math.sin(theta) * Math.sin(delta) * Math.cos(phi1),
            Math.cos(delta) - Math.sin(phi1) * Math.sin(phi2)
        );
        return [toDeg(lambda2), toDeg(phi2)];
    }

    // Centers: lng -180..150 every 30 (12 columns -- the -180 column IS the
    // antimeridian one, added per owner request 2026-07-22; +180 would
    // duplicate it), lat -75..75 every 15 (11 rows, densified from the
    // original 30-degree rows per owner request 2026-07-22 -- adds
    // +-15/+-45/+-75) -- 132 circles total. The antimeridian rings come out
    // of destinationPoint with continuous extended longitudes (approx. -184
    // ..-176, never normalized across the seam), which MapLibre's GeoJSON
    // path renders into the adjacent world copy -- no ring splitting needed.
    // Geometry is fixed at build time; only the `ratio`/`ratioLabel`
    // properties are recomputed and pushed via setData().
    //
    // Each circle is TWO features: the Polygon, and a Point at its center
    // that carries the ratio label. Labeling the polygons directly placed
    // one symbol anchor per tile the polygon touches (MapLibre tiles GeoJSON
    // internally and anchors polygon labels per clipped fragment), so the
    // wide high-latitude ellipses grew duplicate labels as zoom-in shrank
    // tiles under them -- and allow-overlap/ignore-placement drew every one.
    // A point lives in exactly one tile, so one label per circle per world
    // copy. The layers filter on geometry type.
    function buildTissotFeatures() {
        const features = [];
        for (let lng = -180; lng < 180; lng += 30) {
            for (let lat = -75; lat <= 75; lat += 15) {
                const ring = [];
                for (let i = 0; i <= TISSOT_STEPS; i++) {
                    const bearing = (i % TISSOT_STEPS) * (360 / TISSOT_STEPS);
                    ring.push(destinationPoint(lng, lat, TISSOT_RADIUS_DEG, bearing));
                }
                features.push({
                    type: 'Feature',
                    properties: {lng, lat},
                    geometry: {type: 'Polygon', coordinates: [ring]}
                });
                features.push({
                    type: 'Feature',
                    properties: {lng, lat, ratio: 0, ratioLabel: '–'},
                    geometry: {type: 'Point', coordinates: [lng, lat]}
                });
            }
        }
        return features;
    }

    // Built unconditionally: the checkbox can turn the overlay on later in
    // a session that didn't start with ?tissot=1, and it needs real
    // geometry to add at that point.
    const tissotFeatures = buildTissotFeatures();

    // §5.5 polar data void (design proposal): mercator-cut world sources
    // carry nothing beyond ±85.0511°, while Equal Earth renders to ±90 —
    // the style background bled through as a polar strip. Style-side fix:
    // explicit cap polygons. South cap continues the Antarctic ice/land
    // fill; north cap continues the Arctic ocean. Parallels and pole
    // lines are both straight under EE, so simple rectangles suffice
    // (lng sampled every 15° for tiling/subdivision safety). Applied to
    // the mercator-cut styles (overture, demotiles); the local GeoJSON
    // styles carry data to ±90 and need none.
    const MERCATOR_DATA_LIMIT = 85.0511;
    function polarCapFeature(south) {
        const edgeLat = south ? -MERCATOR_DATA_LIMIT : MERCATOR_DATA_LIMIT;
        const poleLat = south ? -90 : 90;
        const ring = [];
        for (let lng = -180; lng <= 180; lng += 15) ring.push([lng, edgeLat]);
        for (let lng = 180; lng >= -180; lng -= 15) ring.push([lng, poleLat]);
        ring.push(ring[0]);
        return {type: 'Feature', properties: {cap: south ? 'south' : 'north'}, geometry: {type: 'Polygon', coordinates: [ring]}};
    }
    const polarCaps = {type: 'FeatureCollection', features: [polarCapFeature(true), polarCapFeature(false)]};

    // Local land data below the mercator limit is the source of tile-
    // aligned fill notches in the Antarctic strip (owner-reported): the
    // Natural Earth ring runs to lat -89.999, which lies BEYOND mercator
    // tile space (merc-y ~1.23), and per-tile ring closure at the last
    // tile row fails in some tiles. Clamp all vertices to the mercator
    // range and let the polar caps (land-colored) paint the pole band
    // seamlessly - the same treatment every mercator-cut mode gets.
    function clampToMercatorRange(geojson) {
        const clampRing = (ring) => ring.map(([lng, lat]) => [lng, Math.max(-MERCATOR_DATA_LIMIT, Math.min(MERCATOR_DATA_LIMIT, lat))]);
        return {
            ...geojson,
            features: geojson.features.map((f) => {
                const g = f.geometry;
                if (g.type === 'Polygon') return {...f, geometry: {...g, coordinates: g.coordinates.map(clampRing)}};
                if (g.type === 'MultiPolygon') return {...f, geometry: {...g, coordinates: g.coordinates.map((p) => p.map(clampRing))}};
                return f;
            })
        };
    }

    // Antimeridian-touching rings (Natural Earth's Antarctica traverses
    // the +-180 edges and the -89.99 bottom) break fill rendering — in
    // STOCK MapLibre mercator too (verified 2026-07-23 against 5.6.0:
    // giant diagonal slashes; upstream repro candidate). Fix: split such
    // polygons at lng 0 into two simple hemispheric pieces
    // (Sutherland–Hodgman against the lng<=0 / lng>=0 half-planes).
    // Fills use the split data; coastLINES come from the unsplit data so
    // no artificial Greenwich seam is drawn.
    function clipRingToHalfPlane(ring, keepWest, boundary = 0) {
        const inside = ([lng]) => keepWest ? lng <= boundary : lng >= boundary;
        const intersect = (a, b) => {
            const t = (boundary - a[0]) / (b[0] - a[0]);
            return [boundary, a[1] + t * (b[1] - a[1])];
        };
        const out = [];
        for (let i = 0; i < ring.length - 1; i++) {
            const cur = ring[i], next = ring[i + 1];
            if (inside(cur)) {
                out.push(cur);
                if (!inside(next)) out.push(intersect(cur, next));
            } else if (inside(next)) {
                out.push(intersect(cur, next));
            }
        }
        if (out.length >= 3) out.push(out[0]);
        return out.length >= 4 ? out : null;
    }

    function splitAntimeridianTouching(geojson) {
        const touchesAM = (rings) => rings.some((ring) => ring.some(([lng]) => Math.abs(lng) >= 179.99));
        return {
            ...geojson,
            features: geojson.features.map((f) => {
                const g = f.geometry;
                const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : null;
                if (!polys || !polys.some(touchesAM)) return f;
                const pieces = [];
                for (const rings of polys) {
                    for (const keepWest of [true, false]) {
                        const clipped = rings.map((ring) => clipRingToHalfPlane(ring, keepWest)).filter(Boolean);
                        if (clipped.length) pieces.push(clipped);
                    }
                }
                return {...f, geometry: {type: 'MultiPolygon', coordinates: pieces}};
            })
        };
    }

    let landDataPromise = null;
    function getLandData() {
        if (!landDataPromise) {
            landDataPromise = fetch('../bench/data/naturalearth-land.json')
                .then((r) => r.json())
                .then(clampToMercatorRange);
        }
        return landDataPromise;
    }
    function getLandFillData() {
        return getLandData().then(splitAntimeridianTouching);
    }

    function polarCapLayers(southColor, northColor) {
        return [
            {id: 'polar-cap-south', type: 'fill', source: 'polar-caps', filter: ['==', ['get', 'cap'], 'south'], paint: {'fill-color': southColor}},
            {id: 'polar-cap-north', type: 'fill', source: 'polar-caps', filter: ['==', ['get', 'cap'], 'north'], paint: {'fill-color': northColor}}
        ];
    }

    // Projected indicatrix axis ratio at a circle's center, with
    // ground-equal sample offsets: the north/south pair is +-0.5 degrees of
    // latitude, and the east/west pair is +-0.5deg/cos(lat) degrees of
    // longitude so both pairs span the same ground distance (grid caps at
    // +-75 degrees, so cos(lat) >= cos(75) ~ 0.26 -- still no pole guard
    // needed). Without the cos(lat) correction, a plain +-0.5deg longitude
    // offset is a shorter ground distance at high latitude and the label
    // stops describing the drawn ellipse. Mutates tissotFeatures in place,
    // then pushes the whole collection back into the source. Expected:
    // ~0.74 at the equator, rising with latitude (~1.69 at +-60, steeper
    // still at +-75 -- Equal Earth flattens high-latitude circles).
    //
    // Seam safety (the -180 column): map.project() wraps longitudes into
    // (lambda0-180, lambda0+180], so a sample pair straddling the seam
    // projects to OPPOSITE screen edges and the raw east-west span reads as
    // the whole world width. Instead of the full E-W span, use twice the
    // smaller half-span from the projected center: x is linear in longitude
    // at fixed latitude in Equal Earth, so for a non-straddling circle both
    // halves are equal and this matches the old computation exactly, while
    // at the seam the far-branch half is discarded. Same treatment N-S for
    // symmetry (no wrap exists in latitude; over 0.5 degrees the asymmetry
    // is negligible).
    function updateTissotRatios() {
        const source = map.getSource('tissot');
        if (!source) return;
        for (const feature of tissotFeatures) {
            if (feature.geometry.type !== 'Point') continue;
            const {lng, lat} = feature.properties;
            const lngOffset = 0.5 / Math.cos(lat * Math.PI / 180);
            const center = map.project([lng, lat]);
            const east = map.project([lng + lngOffset, lat]);
            const west = map.project([lng - lngOffset, lat]);
            const north = map.project([lng, lat + 0.5]);
            const south = map.project([lng, lat - 0.5]);
            const halfWidth = Math.min(Math.abs(east.x - center.x), Math.abs(west.x - center.x));
            const halfHeight = Math.min(Math.abs(north.y - center.y), Math.abs(south.y - center.y));
            const ratio = halfWidth / halfHeight;
            feature.properties.ratio = ratio;
            feature.properties.ratioLabel = Number.isFinite(ratio) ? ratio.toFixed(2) : 'n/a';
        }
        source.setData({type: 'FeatureCollection', features: tissotFeatures});
    }

    // Style builders (mode-checkbox rework): the three view styles are now
    // functions so the live checkboxes can swap them at runtime, not just
    // the URL params at load. Semantics unchanged from the original one-shot
    // `localStyle` block: demotiles takes precedence over choropleth, and
    // `srcMaxOpt` applies to the plain land style only (its historical
    // scope -- the f32 ladder never ran choropleth).
    let choroplethSourceData = null;
    async function getChoroplethSourceData() {
        if (!choroplethSourceData) choroplethSourceData = await buildChoroplethSource();
        return choroplethSourceData;
    }

    async function buildLandStyle() {
        return {
            version: 8,
            projection: projectionSpec(),
            sources: {
                land: {
                    type: 'geojson',
                    data: await getLandFillData(),
                    ...srcMaxOpt
                },
                'land-lines': {
                    type: 'geojson',
                    data: await getLandData(),
                    ...srcMaxOpt
                },
                'polar-caps': {type: 'geojson', data: polarCaps},
                graticule: {
                    type: 'geojson',
                    data: graticule,
                    ...srcMaxOpt
                }
            },
            layers: [
                {id: 'background', type: 'background', paint: {'background-color': '#a4c8e1'}},
                ...polarCapLayers('#d8e8c8', '#a4c8e1'),
                {id: 'land', type: 'fill', source: 'land', paint: {'fill-color': '#d8e8c8'}},
                {id: 'land-coast', type: 'line', source: 'land-lines', paint: {'line-color': '#6b8f5a', 'line-width': 0.7}},
                {id: 'graticule', type: 'line', source: 'graticule', paint: {'line-color': '#7a9cb8', 'line-width': 0.6}}
            ]
        };
    }

    async function buildChoroplethStyle() {
        return {
            version: 8,
            projection: projectionSpec(),
            sources: {
                choropleth: {
                    type: 'geojson',
                    data: await getChoroplethSourceData()
                },
                'polar-caps': {type: 'geojson', data: polarCaps},
                graticule: {
                    type: 'geojson',
                    data: graticule
                }
            },
            layers: [
                {id: 'background', type: 'background', paint: {'background-color': '#a4c8e1'}},
                ...polarCapLayers('#d8e8c8', '#a4c8e1'),
                {
                    id: 'choropleth-fill',
                    type: 'fill',
                    source: 'choropleth',
                    paint: {
                        'fill-color': ['step', ['get', 'bucket'], CHOROPLETH_RAMP[0], 1, CHOROPLETH_RAMP[1], 2, CHOROPLETH_RAMP[2], 3, CHOROPLETH_RAMP[3], 4, CHOROPLETH_RAMP[4]],
                        'fill-opacity': 0.9
                    }
                },
                {id: 'choropleth-outline', type: 'line', source: 'choropleth', paint: {'line-color': '#4d4d4d', 'line-width': 0.4}},
                {id: 'graticule', type: 'line', source: 'graticule', paint: {'line-color': '#7a9cb8', 'line-width': 0.6}}
            ]
        };
    }

    const DEMOTILES_URL = 'https://demotiles.maplibre.org/style.json';
    const DEMOTILES_SET_STYLE_OPTIONS = {
        // Also injects the §5.5 polar caps: demotiles is mercator-cut, so
        // its white Antarctica ends at -85.05 with the page background
        // beneath. South cap = demotiles' Antarctica white; north cap =
        // its ocean blue (read from its background layer at runtime, with
        // a fallback). Caps insert right after the background layer so
        // every data/label layer draws above them.
        transformStyle: (_prev, next) => {
            const backgroundLayer = next.layers.find((l) => l.type === 'background');
            const ocean = (backgroundLayer && backgroundLayer.paint && backgroundLayer.paint['background-color']) || '#d8f2ff';
            const backgroundIndex = next.layers.findIndex((l) => l.type === 'background') + 1;
            const layers = next.layers.slice();
            layers.splice(backgroundIndex, 0, ...polarCapLayers('#ffffff', ocean));
            return {
                ...next,
                projection: projectionSpec(),
                sources: {...next.sources, 'polar-caps': {type: 'geojson', data: polarCaps}},
                layers
            };
        }
    };

    // Overture geometry-only style. Layer names and zoom ranges verified
    // against the archives' own vector_layers metadata (2026-06-17.0): base
    // carries land/water/land_cover/land_use/infrastructure/bathymetry
    // z0-13, buildings carries building/building_part z6-14. Palette
    // extends the local land style's so mode flips are visually comparable.
    // Registering the protocol is idempotent-by-guard; done lazily so the
    // page keeps zero network cost until the mode is actually entered.
    const OVERTURE_RELEASE = '2026-06-17.0';
    function overtureArchiveUrl(theme) {
        return `pmtiles://https://overturemaps-extras-us-west-2.s3.amazonaws.com/tiles/${OVERTURE_RELEASE}/${theme}.pmtiles`;
    }
    let pmtilesProtocolRegistered = false;
    function ensurePmtilesProtocol() {
        if (!pmtilesProtocolRegistered) {
            // In-flight request dedupe around the pmtiles protocol. The
            // provider's world copies are distinct tile keys to MapLibre
            // but identical byte ranges to the archive, and they fire
            // concurrently -- a cold z1 load was measured issuing every
            // tile fetch twice (~5 MB wasted; session 0017 network
            // profile). Keyed by URL; ref-counted so a shared fetch is
            // only aborted when EVERY requester has aborted (a plain
            // shared-promise dedupe would let one copy's cancellation
            // kill a tile the other copy still wants).
            const protocol = new pmtiles.Protocol();
            const inflight = new Map();
            maplibregl.addProtocol('pmtiles', (params, abortController) => {
                let entry = inflight.get(params.url);
                // The aborted-entry guard and the synchronous delete in the
                // abort listener close the same race: a doomed (aborting)
                // entry must never be handed to a NEW requester, or its
                // AbortError marks the fresh tile errored and it sticks
                // unloaded until the next movement (seen as
                // areTilesLoaded()===false in the abort-cycle check).
                if (!entry || entry.ctrl.signal.aborted) {
                    const ctrl = new AbortController();
                    entry = {refs: 0, ctrl, promise: protocol.tile(params, ctrl)};
                    const clear = () => { if (inflight.get(params.url) === entry) inflight.delete(params.url); };
                    // Non-abort failure: ALSO evict the archive's PMTiles
                    // instance. pmtiles 4.4.1 caches directory promises
                    // without evicting rejections (verified: after one
                    // failed directory fetch, every later lookup re-serves
                    // the cached rejection without touching the network) —
                    // which would make the engine's errored-tile
                    // retry-with-cooldown structurally unable to succeed.
                    // A fresh instance rebuilds header+directory caches on
                    // the next request (~200 ms once per failure burst).
                    // Benign aborts (pan-away) keep the healthy instance.
                    entry.promise.then(clear, (err) => {
                        clear();
                        if (!ctrl.signal.aborted && !(err && err.name === 'AbortError')) {
                            const archive = /^pmtiles:\/\/(.+?\.pmtiles)/.exec(params.url);
                            if (archive && protocol.tiles && protocol.tiles.delete) {
                                protocol.tiles.delete(archive[1]);
                            }
                        }
                    });
                    inflight.set(params.url, entry);
                }
                entry.refs++;
                abortController.signal.addEventListener('abort', () => {
                    if (--entry.refs <= 0) {
                        if (inflight.get(params.url) === entry) inflight.delete(params.url);
                        entry.ctrl.abort();
                    }
                });
                // Every requester gets its OWN copy of the payload and the
                // shared original is never handed out: MapLibre transfers
                // the response's ArrayBuffer to a worker, so a shared
                // buffer is detached by whichever copy wins and the other
                // tile sticks in 'loading' forever (the instrumented trail
                // showed exactly the wrap-copy joiners of settle-ok fetches
                // stuck). A 1-2 MB slice() is noise next to the network
                // fetch it dedupes.
                return entry.promise.then((r) => (r && r.data instanceof Uint8Array ? {...r, data: r.data.slice()} : r));
            });
            pmtilesProtocolRegistered = true;
        }
    }

    function buildOvertureStyle() {
        ensurePmtilesProtocol();
        return {
            version: 8,
            projection: projectionSpec(),
            // No `glyphs` URL anywhere in this style, deliberately: this
            // MapLibre version draws glyphs locally via TinySDF whenever the
            // style has no glyph server (glyph_manager.ts), so labels here
            // are network-free and deterministic in headless runs.
            sources: {
                'overture-base': {type: 'vector', url: overtureArchiveUrl('base')},
                'overture-buildings': {type: 'vector', url: overtureArchiveUrl('buildings')},
                // Step 9 label corpus: divisions carries the `division`
                // point layer (z0-12, @name/subtype/population) — country
                // labels from z0, regions and localities as zoom rises.
                // Transportation carries `segment` (z4-14, @name) for
                // line-following road labels.
                'overture-divisions': {type: 'vector', url: overtureArchiveUrl('divisions')},
                'overture-transportation': {type: 'vector', url: overtureArchiveUrl('transportation')},
                'polar-caps': {type: 'geojson', data: polarCaps},
                // Rides along so the projection's curvature signature stays
                // visible over the basemap.
                graticule: {type: 'geojson', data: graticule}
            },
            layers: [
                {id: 'background', type: 'background', paint: {'background-color': '#a4c8e1'}},
                // §5.5 polar caps: south continues Antarctic land/ice, north
                // continues Arctic water (the tinted overture water color).
                ...polarCapLayers('#d8e8c8', '#93bedd'),
                {id: 'land', type: 'fill', source: 'overture-base', 'source-layer': 'land', paint: {'fill-color': '#d8e8c8'}},
                {id: 'land-cover', type: 'fill', source: 'overture-base', 'source-layer': 'land_cover', paint: {'fill-color': '#c2dcaa', 'fill-opacity': 0.5}},
                {id: 'land-use', type: 'fill', source: 'overture-base', 'source-layer': 'land_use', minzoom: 8, paint: {'fill-color': '#cfe0b8', 'fill-opacity': 0.4}},
                // Deliberately NOT the background color: drawn water and
                // "nothing drawn" must never share a pixel value on a debug
                // page (the 2026-07-22 odd-water misread cost two diagnosis
                // sessions before this one-line fix).
                {id: 'water', type: 'fill', source: 'overture-base', 'source-layer': 'water', paint: {'fill-color': '#93bedd'}},
                {id: 'infrastructure', type: 'line', source: 'overture-base', 'source-layer': 'infrastructure', minzoom: 13, paint: {'line-color': '#b0a898', 'line-width': 1}},
                {id: 'roads', type: 'line', source: 'overture-transportation', 'source-layer': 'segment', minzoom: 10, filter: ['==', ['get', 'subtype'], 'road'], paint: {'line-color': '#c4a986', 'line-width': 1.2}},
                {id: 'buildings', type: 'fill', source: 'overture-buildings', 'source-layer': 'building', minzoom: 11, paint: {'fill-color': '#c9c1b6', 'fill-outline-color': '#a89f92'}},
                {id: 'graticule', type: 'line', source: 'graticule', paint: {'line-color': '#7a9cb8', 'line-width': 0.6}},
                // ---- Step 9 label layers (all placement goes through the
                // fixed projectTileCoordinates; collision keys off live λ0).
                // Meridian/parallel labels: line-following symbols along the
                // graticule — meridians bow under Equal Earth, so these are
                // the curved-line-placement regression corpus at every zoom.
                {
                    id: 'graticule-labels', type: 'symbol', source: 'graticule',
                    layout: {
                        'symbol-placement': 'line',
                        'text-field': ['get', 'name'],
                        'text-size': 10,
                        'symbol-spacing': 400
                    },
                    paint: {'text-color': '#4a6b8a', 'text-halo-color': 'rgba(255,255,255,0.85)', 'text-halo-width': 1.2}
                },
                {
                    id: 'road-labels', type: 'symbol', source: 'overture-transportation', 'source-layer': 'segment', minzoom: 11,
                    filter: ['all', ['==', ['get', 'subtype'], 'road'], ['has', '@name']],
                    layout: {
                        'symbol-placement': 'line',
                        'text-field': ['get', '@name'],
                        'text-size': 11
                    },
                    paint: {'text-color': '#6b5537', 'text-halo-color': 'rgba(255,255,255,0.9)', 'text-halo-width': 1.2}
                },
                {
                    id: 'locality-labels', type: 'symbol', source: 'overture-divisions', 'source-layer': 'division', minzoom: 6,
                    filter: ['==', ['get', 'subtype'], 'locality'],
                    layout: {
                        'text-field': ['get', '@name'],
                        'text-size': 11,
                        // Bigger places win contested space deterministically.
                        'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'population'], 0]]
                    },
                    paint: {'text-color': '#444444', 'text-halo-color': 'rgba(255,255,255,0.9)', 'text-halo-width': 1.2}
                },
                {
                    id: 'region-labels', type: 'symbol', source: 'overture-divisions', 'source-layer': 'division', minzoom: 4,
                    filter: ['==', ['get', 'subtype'], 'region'],
                    layout: {
                        'text-field': ['get', '@name'],
                        'text-size': 12,
                        'text-transform': 'uppercase',
                        'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'population'], 0]]
                    },
                    paint: {'text-color': '#7a6a52', 'text-halo-color': 'rgba(255,255,255,0.9)', 'text-halo-width': 1.2}
                },
                {
                    id: 'country-labels', type: 'symbol', source: 'overture-divisions', 'source-layer': 'division',
                    filter: ['==', ['get', 'subtype'], 'country'],
                    layout: {
                        'text-field': ['get', '@name'],
                        'text-size': ['interpolate', ['linear'], ['zoom'], 0, 10, 3, 13, 6, 16],
                        'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'population'], 0]]
                    },
                    paint: {'text-color': '#333333', 'text-halo-color': 'rgba(255,255,255,0.95)', 'text-halo-width': 1.4}
                }
            ]
        };
    }

    function buildTerrainStyle() {
        ensurePmtilesProtocol();
        return {
            version: 8,
            projection: projectionSpec(),
            sources: {
                mapterhorn: {
                    type: 'raster-dem',
                    tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
                    tileSize: 512,
                    encoding: 'terrarium',
                    maxzoom: 12,
                    attribution: '© Mapterhorn'
                },
                watercolor: {
                    type: 'raster',
                    url: 'pmtiles://https://demotiles.maplibre.org/pmtiles/raster/watercolor.pmtiles',
                    tileSize: 512
                },
                // Global Sentinel-2 cloudless imagery (EOX; CORS reflects
                // the origin — verified). WMTS path order is z/y/x.
                s2cloudless: {
                    type: 'raster',
                    tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
                    tileSize: 256,
                    maxzoom: 14,
                    attribution: 'Sentinel-2 cloudless by <a href="https://s2maps.eu">EOX</a>'
                },
                'polar-caps': {type: 'geojson', data: polarCaps},
                graticule: {type: 'geojson', data: graticule}
            },
            layers: [
                {id: 'background', type: 'background', paint: {'background-color': '#a4c8e1'}},
                ...polarCapLayers('#e8ecef', '#a4c8e1'),
                {id: 's2-imagery', type: 'raster', source: 's2cloudless', paint: {'raster-opacity': 0.9}},
                {id: 'watercolor', type: 'raster', source: 'watercolor', minzoom: 5, paint: {'raster-opacity': 0.9}},
                {id: 'hillshade', type: 'hillshade', source: 'mapterhorn', paint: {
                    'hillshade-exaggeration': 0.5,
                    'hillshade-shadow-color': '#47597a',
                    'hillshade-highlight-color': '#fefaf2'
                }},
                {id: 'graticule', type: 'line', source: 'graticule', paint: {'line-color': '#7a9cb8', 'line-width': 0.6}}
            ]
