                },
                {
                    id: 'locality-labels', type: 'symbol', source: 'overture-divisions', 'source-layer': 'division', minzoom: 6,
                    filter: ['==', ['get', 'subtype'], 'locality'],
                    layout: {
                        'text-field': ['get', '@name'],
                        'text-size': 11,
                        // Bigger places win contested space deterministically.
                        'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'population'], 0]]
                    },
                    paint: {'text-color': '#444444', 'text-halo-color': 'rgba(255,255,255,0.9)', 'text-halo-width': 1.2}
                },
                {
                    id: 'region-labels', type: 'symbol', source: 'overture-divisions', 'source-layer': 'division', minzoom: 4,
                    filter: ['==', ['get', 'subtype'], 'region'],
                    layout: {
                        'text-field': ['get', '@name'],
                        'text-size': 12,
                        'text-transform': 'uppercase',
                        'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'population'], 0]]
                    },
                    paint: {'text-color': '#7a6a52', 'text-halo-color': 'rgba(255,255,255,0.9)', 'text-halo-width': 1.2}
                },
                {
                    id: 'country-labels', type: 'symbol', source: 'overture-divisions', 'source-layer': 'division',
                    filter: ['==', ['get', 'subtype'], 'country'],
                    layout: {
                        'text-field': ['get', '@name'],
                        'text-size': ['interpolate', ['linear'], ['zoom'], 0, 10, 3, 13, 6, 16],
                        'symbol-sort-key': ['-', 0, ['coalesce', ['get', 'population'], 0]]
                    },
                    paint: {'text-color': '#333333', 'text-halo-color': 'rgba(255,255,255,0.95)', 'text-halo-width': 1.4}
                }
            ]
        };
    }

    // Mapterhorn terrarium DEM. One config, reused by the `shade` hillshade
    // (source id 'mapterhorn') and the 3D-terrain modifier (a SEPARATE id
    // 'mapterhorn-terrain' -- MapLibre warns if one source feeds both a
    // hillshade layer and setTerrain; same tiles, so the HTTP cache serves the
    // second copy without extra network). Both are injected on demand by the
    // relief modifiers, so terrain/shade drape over any basemap.
    const MAPTERHORN_DEM = {
        type: 'raster-dem',
        tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
        tileSize: 512, encoding: 'terrarium', maxzoom: 12, attribution: '© Mapterhorn'
    };

    // Watercolor raster source. ?watercolor=<url> opts into a global proxy
    // (a CORS-adding reverse proxy of the Cooper Hewitt / Stamen tiles -- the
    // raw endpoint is CORS-blocked so WebGL can't texture it); unset falls back
    // to the demotiles pmtiles mirror (keyless, CORS-clean, Alps region z5+).
    // Degrade-don't-break: a shared copy with no proxy still renders regionally.
    function watercolorSource() {
        if (watercolorProxyUrl) {
            return {type: 'raster', tiles: [watercolorProxyUrl], tileSize: 256, maxzoom: 16,
                attribution: 'Stamen Watercolor / Cooper Hewitt (Smithsonian)'};
        }
        // Warn loudly: the fallback is Alps-only at z5+, so at world zooms it
        // draws NOTHING and looks like a broken basemap rather than a
        // deliberate degrade. No host is named here on purpose -- the proxy is
        // personal infra and must not be baked into an upstream-facing demo.
        console.warn(
            '[equal-earth-demo] ?source=watercolor without ?watercolor=<tile-url>: ' +
            'falling back to the demotiles pmtiles mirror, which covers the ALPS ONLY at z5+ ' +
            '(expect an empty map at world zooms). The global Cooper Hewitt / Stamen tiles ' +
            'serve no Access-Control-Allow-Origin header, so they need a CORS-adding proxy: ' +
            'pass ?watercolor=https://<your-proxy>/watercolor/{z}/{x}/{y}.jpg'
        );
        return {type: 'raster', url: 'pmtiles://https://demotiles.maplibre.org/pmtiles/raster/watercolor.pmtiles',
            tileSize: 512, minzoom: 5, attribution: '© Stamen (demotiles mirror)'};
    }

    // Shared scaffold: background + polar caps + graticule, the common frame a
    // basemap builds on -- and the whole of the "no basemap" style, so relief
    // and overlays can be shown over bare ground.
    function baseScaffold(extraSources, extraLayers) {
        return {
            version: 8,
            projection: projectionSpec(),
            sources: {
                'polar-caps': {type: 'geojson', data: polarCaps},
                graticule: {type: 'geojson', data: graticule},
                ...extraSources
            },
            layers: [
                {id: 'background', type: 'background', paint: {'background-color': '#a4c8e1'}},
                ...polarCapLayers('#e8ecef', '#a4c8e1'),
                ...extraLayers,
                {id: 'graticule', type: 'line', source: 'graticule', paint: {'line-color': '#7a9cb8', 'line-width': 0.6}}
            ]
        };
    }

    function buildWatercolorStyle() {
        ensurePmtilesProtocol();
        return baseScaffold(
            {watercolor: watercolorSource()},
            [{id: 'watercolor', type: 'raster', source: 'watercolor', paint: {'raster-opacity': 1.0}}]
        );
    }

    function buildBlankStyle() {
        return baseScaffold({}, []);
    }

    // 3D terrain is a RELIEF MODIFIER over whatever basemap is active, not its
    // own style. setStyle resets terrain, so this is re-applied after every
    // style load (alongside applyExtraOverlays) and cleared when terrainOn is
    // false. It injects the dedicated DEM source into the current style if
    // missing, then map.setTerrain(). Gated on isStyleLoaded() (addSource needs
    // a loaded style); the styledata fallback catches the live diff-swap path,
    // which leaves isStyleLoaded() briefly false and never fires 'style.load'.
    function applyTerrain() {
        const apply = () => {
            if (terrainOn) {
                if (!map.isStyleLoaded()) return false;
                if (!map.getSource('mapterhorn-terrain')) map.addSource('mapterhorn-terrain', MAPTERHORN_DEM);
                map.setTerrain({source: 'mapterhorn-terrain', exaggeration: terrainExag});
            } else if (map.getTerrain()) {
                map.setTerrain(null);
            }
            return true;
        };
        if (apply()) return;
        // Not ready (style still loading). Retry on both styledata (fires
        // during a live diff-swap) and idle (fires once the initial/URL style
        // is fully loaded, by which point isStyleLoaded() is true) -- the
        // initial inline load fires style.load synchronously inside setStyle,
        // before this page's style.load handler exists, so idle is the
        // reliable catch for it.
        const retry = () => { if (apply()) { map.off('styledata', retry); map.off('idle', retry); } };
        map.on('styledata', retry);
        map.on('idle', retry);
    }

    // `mode` here is the BASEMAP: default (NE land) / watercolor / choropleth /
    // demotiles / overture / hexbins / none. Terrain and shade are relief
    // MODIFIERS re-applied on top (applyTerrain / applyExtraOverlays), not
    // basemaps, so they survive a basemap swap.
    async function applyStyle(mode) {
        // Clear terrain BEFORE swapping styles. Terrain now persists across
        // basemap swaps (it's a modifier), but leaving it active through the
        // swap lets the terrain depth pass (drawDepth) render a transitional
        // frame where painter.style.projection is briefly undefined -> a
        // `shaderPreludeCode` crash. applyTerrain() re-adds it once the new
        // style (and its projection) is fully loaded.
        if (map.getTerrain()) map.setTerrain(null);
        if (mode === 'hexbins') map.setStyle(await buildHexbinStyle());
        else if (mode === 'watercolor') map.setStyle(buildWatercolorStyle());
        else if (mode === 'overture') map.setStyle(buildOvertureStyle());
        else if (mode === 'demotiles') map.setStyle(DEMOTILES_URL, DEMOTILES_SET_STYLE_OPTIONS);
        else if (mode === 'choropleth') map.setStyle(await buildChoroplethStyle());
        else if (mode === 'none') map.setStyle(buildBlankStyle());
        else map.setStyle(await buildLandStyle());
        applyTerrain();
    }

    // `transformStyle` is a `setStyle()` option, not a Map constructor
    // option: the constructor's own internal initial `this.setStyle(...)`
    // call builds a fresh options object that never forwards a
    // `transformStyle` given alongside `style` at the top level, so passing
    // it here (as this page originally did) was silently ignored -- no
    // warning, since this page isn't type-checked -- and demotiles rendered
    // as plain mercator with no projection field at all. Fix: construct
    // without an initial style, then call setStyle() explicitly so
    // transformStyle is actually read (matches the documented
    // map.setStyle(url, {transformStyle}) usage).
    const map = new maplibregl.Map({
        container: 'map',
        center: [centerLng, centerLat],
        zoom,
        pitch: pitchInit
    });
    let clipOn = false; // live transform state; checkbox wiring still happens at 'load'
    // Clip flags must land on the FIRST styled frame, not at the 'load'
    // event (owner report, 2026-07-23, confirmed by a headless state
    // matrix): waiting until 'load' either clamps a below-pole-fit URL
    // zoom UP against the pole-fit floor and silently loses the
    // requested outline view (matrix case B: asked 0.9, got 1.49), or
    // renders pole-fit frames and visibly re-zooms to the outline floor
    // (no zoom param — the "fills the screen, then re-zooms" flash).
    // style.load fires synchronously inside setStyle for inline styles,
    // so this one-shot must be registered BEFORE applyStyle below.
    if (useClip) {
        clipOn = true;
        map.once('style.load', () => {
            const transform = map._camera && map._camera.transform;
            if (!transform) return;
            transform.outlineFitZoomFloor = true;
            transform.clipAtProjectionOutline = useEngineClip;
            map.jumpTo({zoom: params.has('zoom') ? zoom : 0});
        });
    }
    const initialMode = useHexbins ? 'hexbins' : useWatercolor ? 'watercolor' : useOverture ? 'overture' : useDemotiles ? 'demotiles' : useChoropleth ? 'choropleth' : useNoBasemap ? 'none' : 'default';
    await applyStyle(initialMode);
    window.map = map;

    // Tissot mode wiring: source + 3 layers, added/removed through these two
    // functions so both the `?tissot=1` URL param (headless use) and the
    // live diagnostics-panel checkbox drive the same code path. Both
    // functions are idempotent (safe to call repeatedly or out of order).
    // No `beforeId` anywhere: the indicatrices append LAST so they draw on
    // top of every style layer (owner request 2026-07-22 -- they used to
    // slot beneath the local styles' graticule lines).
    function addTissotOverlay() {
        if (map.getSource('tissot')) return;
        map.addSource('tissot', {
            type: 'geojson',
            data: {type: 'FeatureCollection', features: tissotFeatures}
        });
        map.addLayer({
            id: 'tissot-fill',
            type: 'fill',
            source: 'tissot',
            filter: ['==', ['geometry-type'], 'Polygon'],
            paint: {'fill-color': 'rgba(220,50,50,0.35)'}
        });
        map.addLayer({
            id: 'tissot-outline',
            type: 'line',
            source: 'tissot',
            filter: ['==', ['geometry-type'], 'Polygon'],
            paint: {'line-color': '#8b0000', 'line-width': 1}
        });
        map.addLayer({
            id: 'tissot-label',
            type: 'symbol',
            source: 'tissot',
            filter: ['==', ['geometry-type'], 'Point'],
            layout: {
                'text-field': ['get', 'ratioLabel'],
                'text-size': 11,
                'text-allow-overlap': true,
                'text-ignore-placement': true
            },
            paint: {'text-color': '#8b0000'}
        });
        updateTissotRatios();
    }

    function removeTissotOverlay() {
        if (map.getLayer('tissot-label')) map.removeLayer('tissot-label');
        if (map.getLayer('tissot-outline')) map.removeLayer('tissot-outline');
        if (map.getLayer('tissot-fill')) map.removeLayer('tissot-fill');
        if (map.getSource('tissot')) map.removeSource('tissot');
    }

    // Recompute is safe to call whenever -- updateTissotRatios() itself
    // no-ops when the source doesn't currently exist, so this listener can
    // stay attached across checkbox on/off cycles without extra bookkeeping.
    map.on('moveend', updateTissotRatios);

    // View state -> URL (owner-diagnostics QoL, 2026-07-23): center/zoom
    // are written back on every moveend, so the address bar is always a
    // shareable repro of the current view — screenshots stopped being
    // geolocatable guesswork. replaceState only; no history spam.
    map.on('moveend', () => {
        const c = map.getCenter();
        setUrlParam('lng', c.lng.toFixed(4));
        setUrlParam('lat', c.lat.toFixed(4));
        setUrlParam('zoom', map.getZoom().toFixed(2));
    });

    // Antimeridian clip mask. Redrawn on every 'render' (cheap: 362
    // map.project() calls -- forward polynomial only -- plus one even-odd
    // fill). The seam path is the lambda0+180 meridian sampled north-to-
    // south, then the lambda0-180 meridian south-to-north; the implicit
    // connecting segments ARE the pole lines (straight in Equal Earth, and
    // screen space is an affine image of world space at bearing/pitch 0, so
    // straight chords are exact). At zooms above outline-fit the seam lies
    // outside the viewport and the fill degenerates to nothing visible --
    // correct by construction, no special-casing.
    // (clipOn is declared before map construction — see the early clip
    // block there; the 'load' handler still owns checkbox state + mask.)
    const clipCanvas = document.getElementById('clip-mask');
    const clipCtx = clipCanvas.getContext('2d');
    const CLIP_LAT_STEP_DEG = 1;

    function drawClipMask() {
        const dpr = window.devicePixelRatio || 1;
        const w = clipCanvas.clientWidth;
        const h = clipCanvas.clientHeight;
        if (clipCanvas.width !== Math.round(w * dpr) || clipCanvas.height !== Math.round(h * dpr)) {
            clipCanvas.width = Math.round(w * dpr);
            clipCanvas.height = Math.round(h * dpr);
        }
        clipCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        clipCtx.clearRect(0, 0, w, h);
        if (!clipOn) return;
        const lng0 = map.getCenter().lng;
        const seam = new Path2D();
        let started = false;
        for (let lat = 90; lat >= -90; lat -= CLIP_LAT_STEP_DEG) {
            const p = map.project([lng0 + 180, lat]);
            if (started) seam.lineTo(p.x, p.y);
            else { seam.moveTo(p.x, p.y); started = true; }
        }
        for (let lat = -90; lat <= 90; lat += CLIP_LAT_STEP_DEG) {
            const p = map.project([lng0 - 180, lat]);
            seam.lineTo(p.x, p.y);
        }
        seam.closePath();
        if (!useEngineClip) {
            // Exact void white: matches the page's own void (transparent map
            // canvas over the white body) and the gates' isVoidRGB threshold.
            // In engine-clip mode the seam-bit stencil pre-pass produces the
            // void instead and only the cosmetic outline stroke below is
            // drawn page-side.
            const mask = new Path2D();
            mask.rect(-8, -8, w + 16, h + 16);
            mask.addPath(seam);
            clipCtx.fillStyle = '#ffffff';
            clipCtx.fill(mask, 'evenodd');
        }
        // Seam stroke removed 2026-07-23 (owner: read as a faint blue
        // outline against imagery; the engine clip edge is crisp without
        // it). The canvas fallback keeps only its void fill.
    }
    map.on('render', drawClipMask);
    map.on('resize', drawClipMask);

    // This fork's Map is composition-based: the live ITransform hangs off
    // the internal `_camera`, NOT `map.transform` (that property does not
    // exist on Map here -- discovered when the clip gate found it
    // undefined, which also means the diag panel's tileZoom read below was
    // silently dead until this rework). Debug-page-only access, fine to
    // reach into an underscore field.
    function mapTransform() {
        return map._camera && map._camera.transform;
    }

    // Per-dataset label sub-toggles (step 10 QoL): each entry maps one
    // diag sub-checkbox to the symbol layers it controls and the basemap
    // mode it belongs to. Toggling flips layout `visibility` on layers
    // that exist in the current style; datasets whose mode is inactive
    // have no layers present and the checkbox is disabled. State is
    // URL-round-tripped like the other toggles (default on; `<param>=0`
    // opts out) so headless label-isolation runs can pin it.
    // Each label sub-toggle lives in a .diag-sub row (rowId) shown only when
    // its owning basemap is active (panel cleanup — like z_a/z_b and exag).
    // defaultOn: demotiles/overture labels default on (<param>=0 opts out);
    // graticule labels default OFF (owner request — ?lbl-graticule=1 opts in).
    const LABEL_DATASETS = {
        demotiles: {checkboxId: 'diag-lbl-demotiles', rowId: 'diag-lbl-demotiles-row', param: 'lbl-demotiles', mode: 'demotiles', layers: ['countries-label', 'geolines-label'], defaultOn: true},
        divisions: {checkboxId: 'diag-lbl-divisions', rowId: 'diag-lbl-divisions-row', param: 'lbl-divisions', mode: 'overture', layers: ['country-labels', 'region-labels', 'locality-labels'], defaultOn: true},
        roads: {checkboxId: 'diag-lbl-roads', rowId: 'diag-lbl-roads-row', param: 'lbl-roads', mode: 'overture', layers: ['road-labels'], defaultOn: true},
        graticule: {checkboxId: 'diag-lbl-graticule', rowId: 'diag-lbl-graticule-row', param: 'lbl-graticule', mode: 'overture', layers: ['graticule-labels'], defaultOn: false}
    };
    const labelDatasetOn = {};
    for (const key of Object.keys(LABEL_DATASETS)) {
        const ds = LABEL_DATASETS[key];
        labelDatasetOn[key] = ds.defaultOn ? params.get(ds.param) !== '0' : params.get(ds.param) === '1';
    }

    function applyLabelVisibility() {
        for (const key of Object.keys(LABEL_DATASETS)) {
            for (const layerId of LABEL_DATASETS[key].layers) {
                if (map.getLayer(layerId)) {
                    map.setLayoutProperty(layerId, 'visibility', labelDatasetOn[key] ? 'visible' : 'none');
                }
            }
        }
    }

    // Overlay survival across setStyle(): a style swap drops user-added
    // sources/layers, so re-add the tissot overlay when the incoming style
    // becomes usable. Also re-assert the outline-fit floor flag -- cheap
    // insurance against the transform being rebuilt with the style -- and
    // re-apply the label sub-toggle visibilities, which live in layer
    // layout properties the incoming style just reset.
    let tissotOn = false;

    // Cross-dataset overlays (owner request, round 6): coastline
    // polylines, hillshade, and imagery as independent blend layers over
    // ANY data layer — hillshade decoupled from the terrain mode's
    // welded imagery. Each is injected into the live style and
    // re-applied on style swaps below.
    // - coast (REWORKED round 7): Natural Earth coastline POLYLINES,
    //   multi-scale (110m/50m/10m by zoom band). The first cut derived
    //   coastlines from the Overture water polygon boundaries and the
    //   owner's screenshots (2026-07-22 20:49+) killed it: tile-clip
    //   lattices across the ocean, pond speckle, river channels — tiled
    //   POLYGONS are not a coastline dataset. NE is the curated-
    //   philosophy interim: real polylines, one consistent judgment on
    //   how far to follow estuaries inland (the Ob-class call the owner
    //   flagged as the field's perennial disagreement). An OSM-derived
    //   multi-scale build stays future work — preprocess with
    //   Mapshaper's Visvalingam (weighted effective area), not
    //   Douglas-Peucker (owner note, github.com/mbloch/mapshaper).
    //   Definition mismatch, accepted for now: NE coastline is OCEAN
    //   coastline, while the hexbin coast class flags any water
    //   crossing (lakes included) — lake-shore cells won't have a
    //   matching polyline. NE lakes rings are the obvious add if wanted.
    // - shade/image reuse the terrain mode's source configs verbatim;
    //   in terrain mode itself the overlay ids stay distinct, so
    //   toggling there double-draws rather than fighting the mode's own
    //   layers.
    let coastOn = params.get('coast') === '1';
    let shadeOn = params.get('shade') === '1';
    let imageOn = params.get('image') === '1';

    const NE_COAST_URL = (scale) => `https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_${scale}_coastline.geojson`;
    const neCoastCache = new Map(); // scale -> Promise<FeatureCollection>
    let neCoastApplied = null; // scale currently in the ne-coast source
    function neCoastScaleForZoom(z) {
        return z < 3 ? '110m' : z < 6 ? '50m' : '10m';
    }
    function fetchNeCoast(scale) {
        if (!neCoastCache.has(scale)) {
            neCoastCache.set(scale, fetch(NE_COAST_URL(scale)).then((r) => {
                if (!r.ok) throw new Error(`NE coastline ${scale}: HTTP ${r.status}`);
                return r.json();
            }).catch((e) => { neCoastCache.delete(scale); throw e; }));
        }
        return neCoastCache.get(scale);
    }
    async function applyNeCoastData() {
        const scale = neCoastScaleForZoom(map.getZoom());
        if (!coastOn || neCoastApplied === scale || !map.getSource('ne-coast')) return;
        const data = await fetchNeCoast(scale);
        // Re-check after the await: the style may have swapped or the
        // zoom band moved on while the fetch was in flight.
        if (!coastOn || !map.getSource('ne-coast')) return;
        if (neCoastScaleForZoom(map.getZoom()) !== scale) return;
        map.getSource('ne-coast').setData(data);
        neCoastApplied = scale;
    }
    function applyExtraOverlays() {
        if (!map.getStyle()) return;
        const beforeGrat = map.getLayer('graticule') ? 'graticule' : undefined;
        // Add bottom-up with the same anchor: image under shade under coast.
        if (imageOn) {
            if (!map.getSource('s2cloudless')) {
                map.addSource('s2cloudless', {
                    type: 'raster',
                    tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
                    tileSize: 256, maxzoom: 14,
                    attribution: 'Sentinel-2 cloudless by <a href="https://s2maps.eu">EOX</a>'
                });
            }
            if (!map.getLayer('image-ov')) {
                map.addLayer({id: 'image-ov', type: 'raster', source: 's2cloudless', paint: {'raster-opacity': 0.5}}, beforeGrat);
            }
        } else if (map.getLayer('image-ov')) {
            map.removeLayer('image-ov');
        }
        if (shadeOn) {
            if (!map.getSource('mapterhorn')) {
                map.addSource('mapterhorn', {
                    type: 'raster-dem',
                    tiles: ['https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'],
                    tileSize: 512, encoding: 'terrarium', maxzoom: 12,
                    attribution: '© Mapterhorn'
                });
            }
            if (!map.getLayer('shade-ov')) {
                map.addLayer({id: 'shade-ov', type: 'hillshade', source: 'mapterhorn', paint: {
                    'hillshade-exaggeration': 0.5,
                    'hillshade-shadow-color': '#47597a',
                    'hillshade-highlight-color': '#fefaf2'
                }}, beforeGrat);
            }
        } else if (map.getLayer('shade-ov')) {
            map.removeLayer('shade-ov');
        }
        if (coastOn) {
            if (!map.getSource('ne-coast')) {
                map.addSource('ne-coast', {type: 'geojson', data: {type: 'FeatureCollection', features: []}});
                neCoastApplied = null; // fresh (empty) source after a style swap
            }
            if (!map.getLayer('coast-ov')) {
                map.addLayer({id: 'coast-ov', type: 'line', source: 'ne-coast', paint: {
                    'line-color': '#33566e', 'line-width': 1.0, 'line-opacity': 0.9
                }}, beforeGrat);
            }
            applyNeCoastData().catch(console.error);
        } else if (map.getLayer('coast-ov')) {
            map.removeLayer('coast-ov');
        }
    }
    map.on('zoomend', () => {
        applyNeCoastData().catch(console.error);
        applyChoroplethData().catch(console.error);
    });

    // Choropleth hover tooltip (dataviz-skill secondary encoding: the
    // OKLCH/golden-angle palette can't guarantee 171 countries are pairwise
    // distinguishable by hue alone, so the country name on hover is the real
    // identity channel). Layer-scoped map.on() no-ops harmlessly whenever
    // 'choropleth-fill' isn't the current style's layer (every non-choropleth
    // mode), so this needs no mode guard.
    const choroplethPopup = new maplibregl.Popup({closeButton: false, closeOnClick: false});
    map.on('mousemove', 'choropleth-fill', (e) => {
        map.getCanvas().style.cursor = 'pointer';
        const sovereignt = e.features[0]?.properties?.SOVEREIGNT;
        if (!sovereignt) return;
        choroplethPopup.setLngLat(e.lngLat).setText(sovereignt).addTo(map);
    });
    map.on('mouseleave', 'choropleth-fill', () => {
        map.getCanvas().style.cursor = '';
        choroplethPopup.remove();
    });

    map.on('style.load', () => {
        if (tissotOn) addTissotOverlay();
        const transform = mapTransform();
        if (transform) {
            transform.outlineFitZoomFloor = clipOn;
            transform.clipAtProjectionOutline = clipOn && useEngineClip;
        }
        applyLabelVisibility();
        applyGraticuleVisibility();
        applyExtraOverlays();
        applyTerrain();
    });

    // Mode toggles write themselves back into the URL (replaceState, no
    // reload) so the current view mode is always copyable into the headless
    // gate/sweep workflows that drive this page by query string.
    function setUrlParam(name, value) {
        const url = new URL(window.location);
        if (value === null) url.searchParams.delete(name);
        else url.searchParams.set(name, value);
        history.replaceState(null, '', url);
    }

    // Checkboxes start `disabled` in the HTML (unsafe to touch the style
    // before the map has one); enable them and sync initial checked state
    // from the URL params only once 'load' fires.
    map.on('load', () => {
        const tissotCheckbox = document.getElementById('diag-tissot');
        const projClipped = document.getElementById('diag-proj-clipped');
        const projWrapped = document.getElementById('diag-proj-wrapped');
        const projAdaptive = document.getElementById('diag-proj-adaptive');
        const graticuleCheckbox = document.getElementById('diag-graticule');
        const defaultCheckbox = document.getElementById('diag-default');
        const choroplethCheckbox = document.getElementById('diag-choropleth');
        const demotilesCheckbox = document.getElementById('diag-demotiles');
        const overtureCheckbox = document.getElementById('diag-overture');
        const watercolorCheckbox = document.getElementById('diag-watercolor');
        const terrainCheckbox = document.getElementById('diag-terrain');
        const hexbinsCheckbox = document.getElementById('diag-hexbins');

        tissotCheckbox.disabled = false;
        tissotCheckbox.checked = useTissot;
        tissotOn = useTissot;
        if (useTissot) addTissotOverlay();
        tissotCheckbox.addEventListener('change', () => {
            tissotOn = tissotCheckbox.checked;
            if (tissotOn) addTissotOverlay();
            else removeTissotOverlay();
            setUrlParam('tissot', tissotOn ? '1' : null);
        });

        // Projection mode is a 3-way radio group (owner request 2026-07-24).
        // It replaced two checkboxes -- `clip antimeridian` + `adaptive` --
        // which looked mutually exclusive but were not: only the CLIPPED+
        // ADAPTIVE combination is forbidden, leaving three legal states, one
        // more than a single checkbox can carry. The old pair expressed that
        // by force-unchecking and DISABLING the clip box in adaptive mode,
        // which read as a bug; three radios say it outright. URL contract is
        // unchanged, so every existing gate URL and shared link still works:
        //   clipped  = default, no param      wrapped = ?clip=0
        //   adaptive = ?adaptive=1 (never carries a clip param)
        // clipped<->wrapped is live (it's just transform flags); anything
        // involving adaptive reloads, because the projection is a style-
        // construction-time choice in this demo's builders and a live rebuild
        // would drop overlay/label state.
        for (const radio of [projClipped, projWrapped, projAdaptive]) radio.disabled = false;
        projAdaptive.checked = useAdaptive;
        projClipped.checked = !useAdaptive && useClip;
        projWrapped.checked = !useAdaptive && !useClip;
        function reloadWithProjection(mode) {
            const url = new URL(window.location);
            url.searchParams.delete('adaptive');
            url.searchParams.delete('clip');
            if (mode === 'adaptive') url.searchParams.set('adaptive', '1');
            else if (mode === 'wrapped') url.searchParams.set('clip', '0');
            window.location.href = url.toString();
        }
        projAdaptive.addEventListener('change', () => reloadWithProjection('adaptive'));
        projClipped.addEventListener('change', () => {
            if (useAdaptive) reloadWithProjection('clipped');
            else applyClipMode(true);
        });
        projWrapped.addEventListener('change', () => {
            if (useAdaptive) reloadWithProjection('wrapped');
            else applyClipMode(false);
        });

        // Blend-threshold handles (step 13): unlike the adaptive toggle
        // itself, z_a/z_b are a pure projection-spec change -- no overlay
        // rebuild needed -- so these update live via map.setProjection,
        // no reload. Only meaningful (and only shown) in adaptive mode.
        const thresholdsRow = document.getElementById('diag-adaptive-thresholds');
        const zaSlider = document.getElementById('diag-za');
        const zbSlider = document.getElementById('diag-zb');
        const zaVal = document.getElementById('diag-za-val');
        const zbVal = document.getElementById('diag-zb-val');
        const THRESHOLD_MIN_GAP = 0.2;
        let projectionUpdatePending = false;
        function scheduleProjectionUpdate() {
            if (projectionUpdatePending) return;
            projectionUpdatePending = true;
            requestAnimationFrame(() => {
                projectionUpdatePending = false;
                map.setProjection(projectionSpec());
            });
        }
        if (useAdaptive) {
            thresholdsRow.style.display = '';
            zaSlider.disabled = false;
            zbSlider.disabled = false;
        }
        zaSlider.value = zA;
        zbSlider.value = zB;
        zaVal.textContent = zA.toFixed(1);
        zbVal.textContent = zB.toFixed(1);
        zaSlider.addEventListener('input', () => {
            let v = parseFloat(zaSlider.value);
            if (v > zB - THRESHOLD_MIN_GAP) { v = zB - THRESHOLD_MIN_GAP; zaSlider.value = v; }
            zA = v;
            zaVal.textContent = zA.toFixed(1);
            scheduleProjectionUpdate();
        });
        zaSlider.addEventListener('change', () => {
            setUrlParam('za', zA === DEFAULT_ZA ? null : zA.toFixed(1));
        });
        zbSlider.addEventListener('input', () => {
            let v = parseFloat(zbSlider.value);
            if (v < zA + THRESHOLD_MIN_GAP) { v = zA + THRESHOLD_MIN_GAP; zbSlider.value = v; }
            zB = v;
            zbVal.textContent = zB.toFixed(1);
            scheduleProjectionUpdate();
        });
        zbSlider.addEventListener('change', () => {
            setUrlParam('zb', zB === DEFAULT_ZB ? null : zB.toFixed(1));
        });

        // --- Relief: terrain (3D) XOR shade (2D), each draping the active
        // basemap. Both re-apply across basemap swaps (applyTerrain /
        // applyExtraOverlays on style.load). Mutually exclusive: turning one on
        // turns the other off. The exag row is a .diag-sub shown only when
        // terrain is on (like z_a/z_b), so it costs nothing against the E8
        // default-panel budget.
        const shadeCheckbox = document.getElementById('diag-shade');
        const terrainExagRow = document.getElementById('diag-terrain-exag');
        const exagSlider = document.getElementById('diag-exag');
        const exagVal = document.getElementById('diag-exag-val');
        exagSlider.value = terrainExag;
        exagVal.textContent = terrainExag.toFixed(1);
        function refreshTerrainExagRow() {
            terrainExagRow.style.display = terrainOn ? '' : 'none';
            exagSlider.disabled = !terrainOn;
        }
        if (terrainOn) shadeOn = false; // relief is exclusive; terrain wins at init
        terrainCheckbox.disabled = false;
        shadeCheckbox.disabled = false;
        terrainCheckbox.checked = terrainOn;
        shadeCheckbox.checked = shadeOn;
        terrainCheckbox.addEventListener('change', () => {
            terrainOn = terrainCheckbox.checked;
            if (terrainOn && shadeOn) { // relief is exclusive
                shadeOn = false; shadeCheckbox.checked = false; setUrlParam('shade', null); applyExtraOverlays();
            }
            setUrlParam('terrain', terrainOn ? '1' : null);
            refreshTerrainExagRow();
            applyTerrain();
        });
        shadeCheckbox.addEventListener('change', () => {
            shadeOn = shadeCheckbox.checked;
            if (shadeOn && terrainOn) {
                terrainOn = false; terrainCheckbox.checked = false; setUrlParam('terrain', null); refreshTerrainExagRow(); applyTerrain();
            }
            setUrlParam('shade', shadeOn ? '1' : null);
            applyExtraOverlays();
        });
        let terrainUpdatePending = false;
        exagSlider.addEventListener('input', () => {
            terrainExag = parseFloat(exagSlider.value);
            exagVal.textContent = terrainExag.toFixed(1);
            if (terrainUpdatePending) return;
            terrainUpdatePending = true;
            requestAnimationFrame(() => {
                terrainUpdatePending = false;
                if (terrainOn && map.getTerrain()) {
                    map.setTerrain({source: 'mapterhorn-terrain', exaggeration: terrainExag});
                }
            });
        });
        exagSlider.addEventListener('change', () => {
            setUrlParam('exag', terrainExag === DEFAULT_EXAG ? null : terrainExag.toFixed(1));
        });
        refreshTerrainExagRow();

        // Cross-basemap overlays: coast / image (shade is now a relief toggle).
        for (const [id, param, get, set] of [
            ['diag-coast', 'coast', () => coastOn, (v) => { coastOn = v; }],
            ['diag-image', 'image', () => imageOn, (v) => { imageOn = v; }]
        ]) {
            const box = document.getElementById(id);
            box.disabled = false;
            box.checked = get();
            box.addEventListener('change', () => {
                set(box.checked);
                setUrlParam(param, box.checked ? '1' : null);
                applyExtraOverlays();
            });
        }
        applyExtraOverlays();

        if (useClip) {
            mapTransform().outlineFitZoomFloor = true;
            if (useEngineClip) mapTransform().clipAtProjectionOutline = true;
            clipOn = true;
            // Land at the outline-fit floor (the Jenny minimum-zoom state)
            // unless the URL pinned an explicit zoom -- the pole-fit floor
            // already clamped the default zoom before the flag existed.
            if (!params.has('zoom')) map.jumpTo({zoom: 0});
            drawClipMask();
        }
        // Live clipped<->wrapped switch, driven by the projection radios above
        // (hoisted `function` on purpose -- those handlers are registered
        // earlier in this same 'load' callback).
        function applyClipMode(on) {
            const transform = mapTransform();
            transform.outlineFitZoomFloor = on;
            transform.clipAtProjectionOutline = on && useEngineClip;
            clipOn = on;
            if (on) {
                // Zoom out to the outline-fit floor so the mode is
                // immediately visible (0 clamps up to the floor).
                map.jumpTo({zoom: 0});
            } else {
                // Re-apply the constraint at the current view so a
                // below-pole-fit zoom clamps back up. jumpTo() no-ops on
                // unchanged values (C4 gate caught this), so run the
                // transform's own constrain and jump to its RESULT -- that
                // differs whenever re-clamping is actually needed.
                const constrained = transform.applyConstrain(map.getCenter(), map.getZoom());
                map.jumpTo({center: constrained.center, zoom: constrained.zoom});
            }
            drawClipMask();
            // Default is on, so "on" is the no-param state and "off" is the
            // explicit one -- inverted from the other toggles.
            setUrlParam('clip', on ? null : '0');
        }

        // Basemap: a real radio group (owner request 2026-07-24 -- single-
        // select was already the JS behavior, so the control now says so).
        // "No basemap" used to be expressed by unchecking the active box; a
        // native radio cannot be unchecked by clicking, so that state is now
        // its OWN option (`none`), sharing the NE-land row because a
        // full-width row would blow the 345px panel budget. Terrain and shade
        // are NOT here -- they're relief modifiers wired above.
        const noneRadio = document.getElementById('diag-none');
        for (const radio of [defaultCheckbox, noneRadio, watercolorCheckbox, choroplethCheckbox, demotilesCheckbox, overtureCheckbox, hexbinsCheckbox]) {
            radio.disabled = false;
        }
        watercolorCheckbox.checked = useWatercolor;
        choroplethCheckbox.checked = useChoropleth && !useWatercolor && !useDemotiles && !useOverture && !useHexbins;
        demotilesCheckbox.checked = useDemotiles;
        overtureCheckbox.checked = useOverture;
        hexbinsCheckbox.checked = useHexbins;
        noneRadio.checked = useNoBasemap;
        defaultCheckbox.checked = !useNoBasemap && !watercolorCheckbox.checked && !choroplethCheckbox.checked && !useDemotiles && !useOverture && !useHexbins;

        // Hexbin regeneration: rebuild on zoom-bucket change or viewport
        // move beyond z3, throttled by moveend. H3 cells are earth-fixed
        // so regeneration never moves existing cells — hysteresis only
        // avoids pointless rebuild churn.
        map.on('moveend', () => {
            if (!hexbinsCheckbox.checked || !hexLastGen) return;
            const bucket = Math.floor(map.getZoom());
            let stale = bucket !== hexLastGen.bucket;
            if (!stale && map.getZoom() > 3) {
                // Regen only when the view leaves the inner two-thirds of
                // the generated region (hysteresis — the every-moveend
                // first cut made cells visibly pop on each pan). Note the
                // generation frame is unwrapped around the center at gen
                // time, so near ±180 the canonical p.x can jump a world
                // width and trigger an eager (harmless) regen.
                const c = map.getCenter();
                const p = EE.forward(c.lng, c.lat);
                const inX = (hexLastGen.x1 - hexLastGen.x0) / 6;
                const inY = (hexLastGen.y1 - hexLastGen.y0) / 6;
                stale = p.x < hexLastGen.x0 + inX || p.x > hexLastGen.x1 - inX ||
                    p.y < hexLastGen.y0 + inY || p.y > hexLastGen.y1 - inY;
            }
            if (stale) refreshHexbins().catch(console.error);
        });
        // Overture-informed styling arrives late: the water tiles are not
        // loaded when the style (and its initial hexbin data) is built.
        // On idle, if the last generation had to fall back to the Natural
        // Earth raster, retry once per generation — the retry itself
        // marks ovTried, so a view with no queryable water cannot loop.
        map.on('idle', () => {
            if (!hexbinsCheckbox.checked || !hexLastGen) return;
            if (hexLastGen.ov || hexLastGen.ovTried) return;
            if (map.getZoom() <= 3) return;
            hexLastGen.ovTried = true;
            refreshHexbins().then(() => {
                // The refresh replaced hexLastGen; if it STILL had no
                // water features, carry the tried-mark forward so idle
                // does not retry again until a real regen resets it.
                if (hexLastGen && !hexLastGen.ov) hexLastGen.ovTried = true;
            }).catch(console.error);
        });

        // Graticule lines overlay: enabled wherever the current style has
        // the layer (all local styles + overture; not demotiles).
        graticuleCheckbox.checked = graticuleOn;
        graticuleCheckbox.disabled = useDemotiles;
        graticuleCheckbox.addEventListener('change', () => {
            graticuleOn = graticuleCheckbox.checked;
            applyGraticuleVisibility();
            setUrlParam('grat', graticuleOn ? '1' : null);
        });
        applyGraticuleVisibility();

        // Label sub-toggles: initial checked state from the URL, enabled
        // only while the owning basemap mode is active.
        for (const key of Object.keys(LABEL_DATASETS)) {
            const dataset = LABEL_DATASETS[key];
            const checkbox = document.getElementById(dataset.checkboxId);
            checkbox.checked = labelDatasetOn[key];
            checkbox.addEventListener('change', () => {
                labelDatasetOn[key] = checkbox.checked;
                applyLabelVisibility();
                setUrlParam(dataset.param, checkbox.checked ? null : '0');
            });
        }
        // Label sub-rows are shown ONLY while their owning basemap is active
        // (panel cleanup); the checkbox is also enabled/disabled to match.
        function refreshLabelCheckboxEnablement() {
            const activeMode = overtureCheckbox.checked ? 'overture' : demotilesCheckbox.checked ? 'demotiles' : null;
            for (const key of Object.keys(LABEL_DATASETS)) {
                const ds = LABEL_DATASETS[key];
                const active = ds.mode === activeMode;
                const row = document.getElementById(ds.rowId);
                if (row) row.style.display = active ? '' : 'none';
                document.getElementById(ds.checkboxId).disabled = !active;
            }
            graticuleCheckbox.disabled = demotilesCheckbox.checked;
        }
        refreshLabelCheckboxEnablement();
        applyLabelVisibility();

        function activeDataMode() {
            if (hexbinsCheckbox.checked) return 'hexbins';
            if (watercolorCheckbox.checked) return 'watercolor';
            if (overtureCheckbox.checked) return 'overture';
            if (demotilesCheckbox.checked) return 'demotiles';
            if (choroplethCheckbox.checked) return 'choropleth';
            if (defaultCheckbox.checked) return 'default';
            // Either the explicit `none` radio, or (defensively) a group with
            // nothing selected at all.
            return 'none';
        }
        function refreshStyleFromCheckboxes() {
            const mode = activeDataMode();
            applyStyle(mode).catch(console.error);
            refreshLabelCheckboxEnablement();
            // `source` carries every basemap except the implicit `default`
            // (no param) and `choropleth` (kept on its own ?choropleth= for
            // back-compat). `none` is an explicit deselect.
            setUrlParam('source', (mode === 'hexbins' || mode === 'watercolor' || mode === 'overture' || mode === 'demotiles' || mode === 'none') ? mode : null);
            setUrlParam('choropleth', mode === 'choropleth' ? '1' : null);
        }
        // Native `name="diag-basemap"` now enforces exclusivity, so the old
        // hand-rolled unchecking loop is gone. Radios only fire `change` when
        // they BECOME checked, which is exactly when the style must change.
        for (const radio of [defaultCheckbox, noneRadio, watercolorCheckbox, choroplethCheckbox, demotilesCheckbox, overtureCheckbox, hexbinsCheckbox]) {
            radio.addEventListener('change', refreshStyleFromCheckboxes);
        }
    });

    // Diagnostics panel (step-8 wishlist items 1/4/5; Tissot mode is
    // separate). `?diag=0` hides it. Cost: a few textContent writes per
    // rendered frame, only while the map is actually redrawing.
    const diagEl = document.getElementById('diag');
    const diagZoom = document.getElementById('diag-zoom');
    const diagBlend = document.getElementById('diag-blend');
    const diagTiles = document.getElementById('diag-tiles');
    const diagTilesGlyph = document.getElementById('diag-tiles-glyph');
    if (params.get('diag') === '0') diagEl.hidden = true;

    // Section collapse (owner request 2026-07-24). Each .diag-section header
    // toggles its `#diag-body-<key>` sibling; the glyph reads minus when open,
    // plus when closed. Deliberately NOT a URL param: every other toggle
    // writes one, but collapse state is panel chrome, not view state -- a
    // shared money-shot URL should not carry it, and headless gates get a
    // fresh profile (so localStorage is empty) and therefore always measure
    // the fully-expanded panel against the E8/T10 height budget.
    // No map involvement, so this runs at script time, not on 'load'.
    const PANEL_COLLAPSE_KEY = 'ee-demo-panel-collapsed';
    let collapsedSections = new Set();
    try {
        collapsedSections = new Set(JSON.parse(localStorage.getItem(PANEL_COLLAPSE_KEY) || '[]'));
    } catch (e) {
        // Unparseable or storage-denied (file:// in some browsers): start open.
    }
    for (const header of document.querySelectorAll('.diag-section')) {
        const key = header.dataset.section;
        const body = document.getElementById(`diag-body-${key}`);
        const glyph = header.querySelector('.diag-collapse');
        if (!key || !body || !glyph) continue;
        const render = () => {
            const collapsed = collapsedSections.has(key);
            body.style.display = collapsed ? 'none' : '';
            glyph.textContent = collapsed ? '+' : '−';
            header.setAttribute('aria-expanded', String(!collapsed));
        };
        const toggle = () => {
            if (collapsedSections.has(key)) collapsedSections.delete(key);
            else collapsedSections.add(key);
            render();
            try {
                localStorage.setItem(PANEL_COLLAPSE_KEY, JSON.stringify([...collapsedSections]));
            } catch (e) {
                // Storage denied -- collapse still works for this page view.
            }
        };
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
        render();
    }

    // Stopwatch: dataloading -> idle. The first cycle is the page load
    // time; later cycles time tile fetch+parse after each pan/zoom.
    const pageStart = performance.now();
    let busySince = pageStart;
    let lastLoadMs = null;
    let loadLabel = 'page load';

    // Indicator honesty (session 0019 fix, option 3): a tile whose fetch
    // fails non-abort goes to state 'errored', renders as a permanent hole,
    // and is COUNTED AS LOADED by the idle/loaded machinery — so the old
    // indicator showed a clean checkmark over a picture with holes (see
    // docs/resources/2026-07-22-overture-errored-tile-holes-diagnosis.md,
    // outer repo). Count errored tiles in the in-view sets directly and
    // say so. Debug-page-only reach into fork internals, same precedent
    // as mapTransform().
    function countErroredTiles() {
        const tileManagers = map.style && map.style.tileManagers;
        if (!tileManagers) return 0;
        let errored = 0;
        for (const id of Object.keys(tileManagers)) {
            const inView = tileManagers[id]._inViewTiles;
            if (!inView) continue;
            for (const tile of inView.getAllTiles()) {
                if (tile.state === 'errored') errored++;
            }
        }
        return errored;
    }

    function renderDiag() {
        if (diagEl.hidden) return;
        const tileZoom = mapTransform()?.tileZoom;
        diagZoom.textContent = map.getZoom().toFixed(2) +
            (Number.isFinite(tileZoom) ? ` (tiles z${tileZoom})` : '');
        const t = map.style?.projection?.transitionState;
        diagBlend.textContent = typeof t === 'number' ? t.toFixed(2) : 'n/a';
        const busy = busySince !== null;
        const errored = countErroredTiles();
        if (busy) {
            diagTiles.textContent = 'tiles loading…';
            diagTilesGlyph.textContent = '◌';
        } else if (errored > 0) {
            diagTiles.textContent = `tiles loaded in ${Math.round(lastLoadMs)} ms — ${errored} FAILED`;
            diagTilesGlyph.textContent = '✗';
        } else {
            diagTiles.textContent = `tiles loaded in ${Math.round(lastLoadMs)} ms`;
            diagTilesGlyph.textContent = '✓';
        }
        diagTilesGlyph.style.color = (!busy && errored > 0) ? '#ff9090' : '';
        diagTilesGlyph.classList.toggle('diag-spin', busy);
    }

    // WebGL context-loss instrumentation (black-strip / black-viewport
    // investigation on asker, session 0019 follow-up): if the viewport ever
    // blacks out, this row turns the invisible GPU event into an on-screen,
    // timestamped fact — no DevTools needed at repro time. Row is hidden
    // until an event fires so the panel height (gate-load-bearing, see the
    // CSS comment) is unchanged in every normal run. Events also go to the
    // console with timestamps for correlation with brave://gpu.
    const diagGlRow = document.getElementById('diag-gl-row');
    const diagGl = document.getElementById('diag-gl');
    function glEvent(text) {
        const stamp = new Date().toISOString().slice(11, 23);
        diagGlRow.hidden = false;
        diagGl.textContent = `${text} @ ${stamp}`;
        console.error(`[equal-earth-demo] webgl ${text} @ ${stamp}`);
    }
    map.getCanvas().addEventListener('webglcontextlost', (e) => {
        glEvent(`CONTEXT LOST${e.statusMessage ? ` (${e.statusMessage})` : ''}`);
    });
    map.getCanvas().addEventListener('webglcontextrestored', () => glEvent('context restored'));

    map.on('dataloading', () => {
        if (busySince === null) {
            busySince = performance.now();
            loadLabel = 'tiles';
        }
        renderDiag();
    });
    map.on('idle', () => {
        if (busySince !== null) {
            lastLoadMs = performance.now() - busySince;
            busySince = null;
        }
        renderDiag();
    });
    map.on('render', renderDiag);
    renderDiag();
</script>
</body>

</html>
